[package]
name = "octocode-engine"
version = "19.1.0"
edition = "2021"
build = "src/build.rs"
description = "Rust native Octocode engine for context compression, structural search, and LSP semantic navigation"
license = "MIT"
repository = "https://github.com/bgauryy/octocode-mcp"
keywords = ["napi", "llm", "context", "lsp", "nodejs"]
categories = ["development-tools", "text-processing"]

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
needless_pass_by_value = "allow"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
octocode-engine-core = { path = "../octocode-engine-core", default-features = false }
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

[features]
default = ["portable-default", "napi-addon"]
portable-default = ["octocode-engine-core/portable-default"]
napi-addon = ["dep:napi", "dep:napi-derive", "dep:napi-build", "octocode-engine-core/napi-addon"]
napi-test = ["napi-addon", "napi/noop"]
embedded-ast-grep-rewrite = ["octocode-engine-core/embedded-ast-grep-rewrite"]
tree-sitter-cpp = ["octocode-engine-core/tree-sitter-cpp"]
tree-sitter-c-sharp = ["octocode-engine-core/tree-sitter-c-sharp"]
tree-sitter-swift = ["octocode-engine-core/tree-sitter-swift"]
tree-sitter-large-grammars = ["octocode-engine-core/tree-sitter-large-grammars"]
css-quality = ["octocode-engine-core/css-quality"]
tree-sitter-extended = ["octocode-engine-core/tree-sitter-extended"]

[build-dependencies]
napi-build = { version = "2", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
