[package]
name = "octocode-engine"
version = "18.1.1"
edition = "2021"
description = "Rust native Octocode engine for context compression, structural search, and LSP semantic navigation"
license = "MIT"
repository = "https://github.com/bgauryy/octocode-mcp"
keywords   = ["napi", "llm", "context", "lsp", "nodejs"]
categories = ["development-tools", "text-processing"]

[lints.clippy]
all            = { level = "deny", priority = -1 }
unwrap_used    = "deny"
needless_pass_by_value = "allow"
dbg_macro      = "deny"
print_stdout   = "deny"
print_stderr   = "deny"

[lints.rust]
# Dead-code family: warn-by-default → deny, so `cargo check`/`clippy`/`build`
# all FAIL hard on unused code (codifies the clean state; prevents regressions).
# `#[allow(...)]` still overrides per-site (e.g. feature-gated `unused_mut`).
dead_code        = "deny"
unused_imports   = "deny"
unused_variables = "deny"
unused_mut       = "deny"

[lib]
# `cdylib` is the napi addon; `rlib` additionally lets Rust bench/integration
# targets link the crate as a library (criterion benches under `benches/`).
crate-type = ["cdylib", "rlib"]

[dependencies]
napi        = { version = "3", default-features = false, features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "3"
rayon       = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
serde_yaml_ng = "0.10"  # maintained continuation of serde_yaml (archived upstream)
regex       = "1"
regex-syntax = "0.8"   # prescan literal extraction (already vendored via regex)
aho-corasick = "1"     # sanitizer literal prescan (already vendored via regex)
tokio       = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }
url         = "2"
which       = "8"

# ── ripgrep, as a library ─────────────────────────────────────────────────────
# We run the search in-process instead of shelling out to an `rg` binary, so
# octocode is its own source of ripgrep. `grep` is ripgrep's own engine
# (grep-searcher + grep-regex + grep-matcher + grep-printer); the `pcre2`
# feature pulls grep-pcre2 for `-P` (lookaround/backrefs), with libpcre2
# vendored & compiled from source (no system dependency). `ignore` provides the
# gitignore-aware walker plus the `-g` override globs and `-t` type definitions.
grep   = { version = "0.3", features = ["pcre2"] }
ignore = "0.4"

# ── line diff (Myers) for edit-tool / patch previews ────────────────────────
similar = "2"

# ── security pins: transitive deps pinned to patched versions ────────────────
# crossbeam-epoch <0.9.20: RUSTSEC-2026-0204 (invalid pointer dereference)
# Pulled in by rayon → crossbeam-deque → crossbeam-epoch.
crossbeam-epoch = "0.9.20"
# memmap2 <0.9.11: RUSTSEC-2026-0186 (unchecked pointer offset — unsound)
# Pulled in by grep → grep-searcher → memmap2.
memmap2 = "0.9.11"

# ── high-quality CSS minifier — opt-in via the `css-quality` feature ──────────
# Off by default: lightningcss is the single largest crate (~26MB rlib) and the
# sole source of every shipped duplicate crate version (syn1, phf0.11, rand0.8,
# convert_case0.6, via its parcel_selectors/lightningcss-derive subtree). With
# the feature off, quality CSS minification degrades to the `minify_css_core`
# regex baseline (see src/minify/strategies/web.rs). Enable `css-quality` for
# parser-grade CSS/SCSS/LESS + HTML `<style>` minification.
lightningcss = { version = "1.0.0-alpha.71", default-features = false, optional = true }

# ── OXC — JS/TS AST minifier + native semantic (scopes/bindings/refs) ─────────
oxc_allocator = "0.137"
oxc_ast       = "0.137"
oxc_codegen   = "0.137"
oxc_minifier  = "0.137"
oxc_parser    = "0.137"
oxc_span      = "0.137"
oxc_semantic  = "0.137"   # real ECMAScript scopes/bindings/in-file refs — native JS/TS symbols

# ── tree-sitter core ─────────────────────────────────────────────────────────
tree-sitter          = "0.26"
tree-sitter-language = "0.1"

# ── top-10 grammar crates ─────────────────────────────────────────────────────
tree-sitter-typescript = "0.23"   # covers .ts / .tsx
tree-sitter-javascript = "0.25"   # covers .js / .jsx / .mjs / .cjs
tree-sitter-python     = "0.23"   # covers .py
tree-sitter-go         = "0.23"   # covers .go
tree-sitter-rust       = "0.23"   # covers .rs
tree-sitter-java       = "0.23"   # covers .java
tree-sitter-c          = "0.23"   # covers .c / .h
tree-sitter-cpp        = { version = "0.23", optional = true }  # covers .cpp / .hpp / .cc
tree-sitter-c-sharp    = { version = "0.23", optional = true }  # covers .cs
tree-sitter-bash       = "0.23"   # covers .sh / .bash / .zsh
tree-sitter-json       = "0.24"
tree-sitter-yaml       = "0.7"
tree-sitter-toml-ng    = "0.7"
tree-sitter-html       = "0.23"
tree-sitter-css        = "0.25"
tree-sitter-scss       = "1"
tree-sitter-less       = "1"
tree-sitter-scala      = { version = "0.26", optional = true }  # .scala / .sc / .sbt (structural search only) — tree-sitter-extended

# ── Priority-1 language additions ─────────────────────────────────────────────
tree-sitter-ruby   = "0.23"   # official tree-sitter org — .rb / .rake / .gemspec
tree-sitter-php    = "0.24"   # official tree-sitter org — .php (dual grammar: php + php_only)
tree-sitter-kotlin-ng = "1.1"  # modern fork with tree-sitter-language 0.1 bindings — .kt / .kts
tree-sitter-elixir = { version = "0.3", optional = true }    # .ex / .exs — tree-sitter-extended
tree-sitter-hcl    = { version = "1.1", optional = true }    # .tf / .hcl / .tfvars — tree-sitter-extended
tree-sitter-lua    = { version = "0.5", optional = true }    # .lua — tree-sitter-extended

# ── Priority-2 language additions ─────────────────────────────────────────────
tree-sitter-sequel = { version = "0.3", optional = true }    # SQL (crate name is "sequel", not "sql") — .sql — tree-sitter-extended
tree-sitter-proto  = { version = "0.4", optional = true }    # Protobuf proto2 + proto3 — .proto — tree-sitter-extended
tree-sitter-ocaml  = { version = "0.25", optional = true }   # .ml / .mli (dual grammar) — tree-sitter-extended
tree-sitter-zig    = { version = "1.1", optional = true }    # .zig — tree-sitter-extended

# ── Priority-3 language additions ─────────────────────────────────────────────
tree-sitter-r      = { version = "1.3", optional = true }    # .r — tree-sitter-extended
tree-sitter-julia  = { version = "0.23", optional = true }   # .jl — tree-sitter-extended
tree-sitter-erlang = { version = "0.19", optional = true }   # .erl / .hrl — tree-sitter-extended

# ── Large/complex grammar — feature-gated ─────────────────────────────────────
tree-sitter-swift  = { version = "0.7", optional = true }   # .swift

[features]
# Ship EVERYTHING by default — no capability is ever removed from the published
# binary (all grammars: structural/AST + signatures; parser-grade CSS). The
# feature flags exist only as an explicit opt-OUT: a size-constrained build can
# use `--no-default-features` + a subset to shrink the binary, but the default
# product loses nothing.
default = ["tree-sitter-large-grammars", "tree-sitter-extended", "css-quality"]
tree-sitter-cpp     = ["dep:tree-sitter-cpp"]
tree-sitter-c-sharp = ["dep:tree-sitter-c-sharp"]
tree-sitter-swift   = ["dep:tree-sitter-swift"]
tree-sitter-large-grammars = ["tree-sitter-cpp", "tree-sitter-c-sharp", "tree-sitter-swift"]
# Opt-in parser-grade CSS (lightningcss). Off by default — see the lightningcss
# dependency comment for the size/duplicate-version rationale.
css-quality = ["dep:lightningcss"]
# Opt-in long-tail language grammars (structural search + signatures). Off by
# default to keep the shipped binary lean; the core set (ts/js/py/go/rs/java/c/
# bash/ruby/php/kotlin + web/config markup) stays always-on. Enable for OCaml,
# Julia, Scala, Erlang, R, Zig, SQL, Protobuf, Elixir, HCL/Terraform, Lua.
tree-sitter-extended = [
  "dep:tree-sitter-elixir",
  "dep:tree-sitter-hcl",
  "dep:tree-sitter-lua",
  "dep:tree-sitter-sequel",
  "dep:tree-sitter-proto",
  "dep:tree-sitter-ocaml",
  "dep:tree-sitter-zig",
  "dep:tree-sitter-r",
  "dep:tree-sitter-julia",
  "dep:tree-sitter-erlang",
  "dep:tree-sitter-scala",
]

[dev-dependencies]
napi      = { version = "3", default-features = false, features = ["noop", "napi4", "tokio_rt", "serde-json"] }
proptest  = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "structural"
harness = false

[[bench]]
name = "minify"
harness = false

[build-dependencies]
napi-build = "2"

[profile.release]
lto           = true
codegen-units = 1
opt-level     = 3
strip         = "symbols"

# Build regex-automata with full optimizations even in debug/test profiles.
# Without this, the regex crate's DFA literal-optimization is disabled at the
# default debug opt-level, causing pathological performance on large strings
# (e.g. the 500KB+multibyte chunk-boundary property test). Release is unaffected
# (already opt-level=3); this only warms the debug/test hot path.
[profile.dev.package."regex-automata"]
opt-level = 3

[profile.test.package."regex-automata"]
opt-level = 3
