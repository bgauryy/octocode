[package]
name = "octocode-extension-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native filesystem and text primitives for the Octocode extension"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
libc = "0.2"
sha2 = "0.11"
sha1 = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
similar = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.clippy]
all = { level = "deny", priority = -1 }
