[package]
name = "octocode-security"
version = "0.1.0"
edition = "2021"
description = "Rust-backed secret detection for Node.js — high-performance regex scanning with napi-rs"
license = "MIT"
repository = "https://github.com/bgauryy/octocode-mcp"
keywords = ["napi", "nodejs", "security", "secrets", "detection"]
categories = ["development-tools"]

[lints.clippy]
unwrap_used = "deny"   # use ? or expect with a message; tests exempt via clippy.toml

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi9"] }
napi-derive = "2"
regex = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"

[build-dependencies]
napi-build = "2"
