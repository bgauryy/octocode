[package]
name = "octocode-security"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi9"] }
napi-derive = "2"
regex = "1"
once_cell = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"

[build-dependencies]
napi-build = "2"
