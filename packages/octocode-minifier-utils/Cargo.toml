[package]
name = "octocode-minifier-utils"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust minification, signature extraction (tree-sitter), and YAML utilities for Octocode"
license = "MIT"
repository = "https://github.com/bgauryy/octocode-mcp"
keywords   = ["napi", "minifier", "tree-sitter", "signatures", "nodejs"]
categories = ["development-tools", "text-processing"]

[lints.clippy]
unwrap_used = "deny"   # use ? or expect with a message; tests exempt via clippy.toml

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "2", features = ["napi4", "serde-json"] }
napi-derive = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml_ng = "0.10"  # maintained continuation of serde_yaml (archived upstream)
regex       = "1"

# ── high-quality CSS / HTML minifiers ────────────────────────────────────────
lightningcss = "1.0.0-alpha.71"
minify-html  = "0.18"

# ── OXC — JS/TS AST minifier (already in Cargo.lock via minify-html) ─────────────
oxc_allocator = "0.95"
oxc_ast       = "0.95"
oxc_codegen   = "0.95"
oxc_minifier  = "0.95"
oxc_parser    = "0.95"
oxc_span      = "0.95"

# ── tree-sitter core ─────────────────────────────────────────────────────────
tree-sitter          = "0.26"
tree-sitter-language = "0.1"

# ── top-10 grammar crates ─────────────────────────────────────────────────────
tree-sitter-typescript = "0.23"   # covers .ts / .tsx
tree-sitter-javascript = "0.23"   # covers .js / .jsx / .mjs / .cjs
tree-sitter-python     = "0.23"   # covers .py
tree-sitter-go         = "0.23"   # covers .go
tree-sitter-rust       = "0.23"   # covers .rs
tree-sitter-java       = "0.23"   # covers .java
tree-sitter-c          = "0.23"   # covers .c / .h
tree-sitter-cpp        = "0.23"   # covers .cpp / .hpp / .cc
tree-sitter-c-sharp    = "0.23"   # covers .cs
tree-sitter-bash       = "0.23"   # covers .sh / .bash / .zsh

[build-dependencies]
napi-build = "2"

[profile.release]
lto           = true
codegen-units = 1
opt-level     = 3
strip         = "symbols"
