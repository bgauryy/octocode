interface:
  display_name: "Octocode Awareness"
  short_description: "Always-on workspace awareness: collaboration, learning, memory/wiki, bookkeeping, housekeeping, locks, verification."
  default_prompt: "Use always when working in a workspace. Run attend --workspace \"$PWD\" --query \"<current task>\" --compact; inspect Ready, Claimed, Verify, and FilesUnderWork. Claim a matching task or open explicit work with reasoning/files/test plan. Declare every edited file; ordinary overlap is allowed, while sensitive work uses exclusive protection. Submit/end, run checks, verify, then bookkeep (reflect/memory) and housekeep (digest/prune dry-run) before closing."
