[package]
name = "octocode-agents-communication"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
path = "rust/lib.rs"

[[bin]]
name = "octocode-agents-communication"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
jsonschema = { version = "0.57", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "functions"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tungstenite = "0.30"
ureq = { version = "3", default-features = false, features = ["json"] }
# Exact pins: lease path components are compared with Unicode 16 canonical
# caseless matching, NFD(casefold(NFD(x))), and the shipped Python client
# (sqlite_agent.py, Python 3.14 / unidata 16.0.0) must fold identically. A data
# table bump could let two agents lease one path under different keys. See
# docs/LOCKS.md and docs/DB.md; upgrade only with the Python Unicode check.
caseless = "=0.2.2"
unicode-normalization = "=0.1.24"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "user"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
