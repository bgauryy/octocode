# Cargo configuration shared by every machine that builds octocode-native.
#
# Machine-specific speedups (sccache, mold, another linker) go in the gitignored
# config.local.toml next to this file: a committed linker path or rustc-wrapper
# breaks every machine that lacks that exact tool. Start from
# config.local.example.toml.
include = [{ path = "config.local.toml", optional = true }]

# ── Disk hygiene (target/ grows unbounded) ────────────────────────────────────
# Stable Cargo has no target/ GC (`cargo clean gc` is nightly-only; Cargo 1.88+
# only auto-cleans ~/.cargo caches). Most of the 2026-11-13 bloat (307 GiB, 731k
# files in one deps/) was incremental `.rcgu.o` objects with per-run names
# (rust-lang/rust#161824); `[profile.dev] incremental = false` stops that. What
# remains: every distinct package/feature selection compiles its own copy of the
# workspace crates, so keep cargo on the wrappers' selections. After each run,
# build-native.cjs, rust-tests.cjs and rust-lint.mjs record the units Cargo used
# in target/.keep/, delete stale `.rcgu.o` of the units they recompiled, and print
# `deps: N entries`. To drop the rest, with no cargo process running:
#   node skills-dev/octocode-dev/scripts/dev.mjs prune:rust [--dry-run]
#     # removes deps/.fingerprint/build entries no keep record of the last 7 days
#     # lists, incremental/ dirs, and files copied into target/<profile>/
#   yarn clean:cache          # cargo clean --workspace --profile dev: every copy
#                             # of our crates, dependencies stay warm

# ── One test selection, one build ─────────────────────────────────────────────
# `cargo dev-test` is the first Rust test selection (scripts/rust-tests.cjs) under
# libtest: the same packages and features, so it reuses the crates `test:rust`
# and `build:dev` compiled instead of forking another copy, and it runs each
# test binary in one process, as `test:rust` runs every test but the ones that
# start child processes (about 4× faster than nextest's process per test).
# A bare `cargo test -p octocode-native` drops `dev-unify` and builds a second
# copy. Narrow a run with a libtest filter, which every binary applies:
#   cargo dev-test -- runtime_github_history::      # an integration-test file
#   cargo dev-test -- local_search::                # a tool crate's unit-test module
#   cargo dev-test -- structural::                  # an engine unit-test module
# tests/build-publication.test.cjs keeps this alias equal to that selection. Its
# runner fails a test stuck past libtest's slow-test line (scripts/test-watchdog.cjs),
# and its path is relative to where cargo runs: run it from this package.
[alias]
dev-test = "test --locked -p octocode-native -p octocode-runtime-base -p octocode-tools-shared -p octocode-tool-graph -p octocode-tool-lsp -p octocode-tool-github -p octocode-tool-local -p octocode-tool-ast -p octocode-tool-packages -p octocode-tool-clasify -p octocode-github -p octocode-io -p octocode-cli -p octocode-engine -p octocode-contract-types -p octocode-test-support --features octocode-native/dev-unify --config=target.'cfg(all())'.runner=\"scripts/test-watchdog.cjs\""

# ── aws-lc: OS entropy, not CPU jitter ────────────────────────────────────────
# rustls' crypto provider (aws-lc-rs over aws-lc-sys) seeds its random generator
# on a process's first random draw: its first TLS connection. With CPU-jitter
# entropy built in (aws-lc-sys's default, always compiled at -O0 so the timing
# jitter it measures is real) that seeding was 67% of the CPU of a first
# artifactSearch call (samply, 2026-11-19), paid by every process: each one-shot
# CLI call, each MCP server and the warm daemon. AWS-LC's opt-out configuration
# (`DISABLE_CPU_JITTER_ENTROPY`, `crypto/fipsmodule/rand/entropy/entropy_sources.c`)
# seeds from the OS source (getentropy) and draws its personalization from the
# CPU's RNG (RNDR, RDRAND) when present, else the OS; ring and BoringSSL seed
# from the OS alone. Not a FIPS build, which has no jitter source anyway.
[env]
AWS_LC_SYS_NO_JITTER_ENTROPY = "1"

# ── Windows: static MSVC runtime ──────────────────────────────────────────────
# Link the C runtime into octocode.exe so it starts on a clean Windows without
# the Visual C++ Redistributable (vcruntime140.dll). Release builds append their
# path remaps to these flags (scripts/build-native.cjs); a RUSTFLAGS or
# CARGO_ENCODED_RUSTFLAGS environment variable replaces them all.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# ── macOS: keep Apple's default linker ────────────────────────────────────────
# Measured 2026-10-06 (octocode-cli, Apple Silicon): relink after a cli edit
# 1.4–1.8s with lld vs 1.2–1.6s with Apple ld-prime, cold build 90s vs 88s.
# No win, so no linker override — matches the Rust perf book for macOS.
