# Development build acceleration for octocode-native.
#
# Everything here is OPT-IN and left commented on purpose: a committed, enabled
# linker path (or rustc-wrapper) breaks any machine that lacks the exact tool at
# the exact path — Linux devs and Intel Macs. Enable the blocks
# below locally after installing the tool.
#
# Install:
#   sccache : brew install sccache            (cross-branch compile cache)
#   mold    : apt install mold                (fast linker on Linux)
#
# ── Disk hygiene (target/ grows unbounded) ────────────────────────────────────
# Stable Cargo has no target/ GC (`cargo clean gc` is nightly-only; Cargo 1.88+
# only auto-cleans ~/.cargo caches). Every distinct feature/package selection
# compiles its own copy of the workspace crates, and `split-debuginfo =
# "unpacked"` keeps ~2k `.o` per copy — target/ reached 303 GB / 1M files in one
# deps/ here. Keep cargo invocations on the same package+feature selection so
# copies are not created, and reset the dev profile when it grows:
#   yarn clean:cache          # cargo clean --workspace --profile dev: drops every
#                             # copy of our crates (88% of debug/ here), keeps deps warm
# `dev.mjs build:dev` and `test:rust` run it first when target/debug is over 50 GiB.

# ── One test selection, one build ─────────────────────────────────────────────
# `cargo dev-test` is the first Rust test selection (scripts/rust-tests.cjs) under
# libtest: the same packages and features, so it reuses the crates `test:rust`
# and `build:dev` compiled instead of forking another copy, and it runs each
# test binary in one process (about 4× faster than nextest's process per test).
# A bare `cargo test -p octocode-native` drops `dev-unify` and builds a second
# copy. Narrow a run with a libtest filter, which every binary applies:
#   cargo dev-test -- runtime_github_history::      # an integration-test file
#   cargo dev-test -- tools::local_search::         # a runtime unit-test module
# tests/build-publication.test.cjs keeps this alias equal to that selection.
[alias]
dev-test = "test --locked -p octocode-native -p octocode-github -p octocode-io -p octocode-cli --features octocode-native/dev-unify"

# ── sccache: cache rustc invocations across branches / clean builds ───────────
# 60–80% faster on a warm cache. Tradeoff: sccache disables incremental
# compilation, so it HELPS clean builds and branch switches but can HURT a tight
# single-file edit loop. Prefer enabling it per-shell via env rather than here:
#   export RUSTC_WRAPPER=sccache
#   cargo build            # then: sccache --show-stats
#
# [build]
# rustc-wrapper = "sccache"

# ── macOS: keep Apple's default linker ────────────────────────────────────────
# Measured 2026-10-06 (octocode-cli, Apple Silicon): relink after a cli edit
# 1.4–1.8s with lld vs 1.2–1.6s with Apple ld-prime, cold build 90s vs 88s.
# No win, so no linker override — matches the Rust perf book for macOS.

# ── Linux: mold (apt install mold) ────────────────────────────────────────────
# mold is 5–10× faster than GNU BFD at linking large Rust binaries. The native
# CI job (`.github/workflows/ci.yml`) installs it with `rui314/setup-mold`.
#
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
#
# [target.aarch64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
