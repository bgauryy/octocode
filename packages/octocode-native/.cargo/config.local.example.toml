# Machine-specific Cargo settings for octocode-native. Copy to config.local.toml
# (gitignored; config.toml includes it when present) and keep the blocks whose
# tool this machine has installed.

# ── sccache: cache rustc invocations across branches and clean builds ─────────
# brew install sccache | cargo install sccache. Helps clean builds and branch
# switches; check hits with `sccache --show-stats`.
# [build]
# rustc-wrapper = "sccache"

# ── Linux: mold ───────────────────────────────────────────────────────────────
# apt install mold clang. mold links large Rust binaries 5–10× faster than GNU
# ld. Cargo joins these flags with config.toml's.
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
#
# [target.aarch64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
