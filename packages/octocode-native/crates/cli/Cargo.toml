[package]
name = "octocode-cli"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
autotests = false
description = "Command-line hosts for the Octocode runtime"

[[bin]]
name = "octocode"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
octocode-io = { path = "../io" }
octocode-native = { path = "../runtime" }
octocode-contract-types = { path = "../contract-types" }
octocode-engine = { path = "../engine" }
octocode-github = { path = "../github" }
clap = { version = "4", features = ["derive", "string"] }
serde_json = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
# Skill installs stage a replacement in a temporary directory beside it.
tempfile = { workspace = true }
toml = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
flate2 = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "io-std", "time", "process"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
subtle = "2"
# The MCP server (`octocode mcp`): stdio transport over the shared runtime.
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
junction = "2.1"

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
