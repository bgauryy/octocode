[package]
name = "octocode-cli"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
autotests = false
description = "Command-line hosts for the Octocode runtime"

[[bin]]
name = "octocode"
path = "src/main.rs"

[[bin]]
name = "octocode-regex-worker"
path = "src/bin/regex_worker.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
octocode-native = { path = "../runtime" }
octocode-engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml_ng = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
regress = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
