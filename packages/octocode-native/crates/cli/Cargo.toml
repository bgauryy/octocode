[package]
name = "octocode-cli"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
description = "Command-line hosts for the Octocode runtime"

[[bin]]
name = "octocode"
path = "src/main.rs"

[[bin]]
name = "octocode-regex-worker"
path = "src/bin/regex_worker.rs"

[dependencies]
octocode-native = { path = "../runtime" }
octocode-engine = { path = "../engine", default-features = false, features = ["portable-default", "embedded-ast-grep-rewrite"] }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
toml = { version = "0.9", features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }
futures-util = "0.3"
tokio-util = { version = "0.7", default-features = false }
url = { workspace = true }
regress = "0.12"
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "system-proxy"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
