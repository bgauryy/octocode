[package]
name = "octocode-native"
version = "20.0.0"
publish = false
edition = "2024"
# MSRV floor shared with octocode-engine (File::try_lock/unlock, Rust 1.89).
# Enforced by clippy::incompatible_msrv; verify with a CI MSRV job.
rust-version = "1.89"
autobins = false
autoexamples = false
license = "MIT"
description = "Native Octocode tool runtime and command-line interface"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "octocode"
path = "src/main.rs"

[[bin]]
name = "octocode-regex-worker"
path = "src/bin/regex_worker.rs"

[features]
default = []
napi-addon = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
regex = "1"
regress = "0.12"
url = "2"
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.3"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "query", "system-proxy"] }
bytes = "1"
futures-util = "0.3"
secrecy = "0.10"
keyring-core = "1"
hex = "0.4"
octocode-engine = { path = "../engine", default-features = false, features = ["portable-default", "embedded-ast-grep-rewrite"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
windows-native-keyring-store = "1"

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
let_underscore_drop = "allow"   # allow intentional best-effort let _ = result; patterns

[lints.clippy]
all = { level = "deny", priority = -1 }
# Correctness / safety
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# print_stdout/print_stderr intentionally NOT denied — runtime is a CLI binary
