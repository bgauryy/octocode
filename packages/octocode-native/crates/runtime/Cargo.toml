[package]
name = "octocode-native"
version = "20.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
autobins = false
autoexamples = false
license.workspace = true
repository.workspace = true
description = "Native Octocode tool runtime and command-line interface"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "octocode"
path = "src/main.rs"

[[bin]]
name = "octocode-regex-worker"
path = "src/bin/regex_worker.rs"

[features]
default = []
napi-addon = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.9", features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }
regex = { workspace = true }
regress = "0.12"
url = { workspace = true }
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.3"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "query", "system-proxy"] }
bytes = "1"
futures-util = "0.3"
secrecy = "0.10"
keyring-core = "1"
hex = "0.4"
octocode-engine = { path = "../engine", default-features = false, features = ["portable-default", "embedded-ast-grep-rewrite"] }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
windows-native-keyring-store = "1"

# Inherits the shared floor from [workspace.lints] (root Cargo.toml). The runtime
# is the CLI-owning binary, so it deliberately does NOT deny print_stdout /
# print_stderr — that stricter policy lives only in the engine library's inline
# lint block.
[lints]
workspace = true
