[package]
name = "octocode-native"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
autobins = false
autotests = false
autoexamples = false
license.workspace = true
repository.workspace = true
description = "Native Octocode tool execution library"

[lib]
crate-type = ["rlib"]

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
# Dev-loop feature unification, enabled by `build:dev` and `test:rust` but never
# by release builds. wiremock and tempfile (dev-dependencies) turn these features
# on in test builds; without the same set in `build:dev`, every `cargo test`
# recompiled hyper → reqwest → this crate → cli under new hashes (47 extra units,
# measured with `cargo --unit-graph`). Off in release: always-on cost +1.2% CLI
# binary size. Keep in sync with test deps; napi's `noop` is deliberately excluded.
dev-unify = ["dep:hyper", "dep:hyper-util", "dep:bitflags", "dep:fastrand", "dep:slab", "tokio-util/codec"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml_ng = { workspace = true }
regex = { workspace = true }
# Generated contract types use ECMAScript pattern validation.
regress = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
reqwest = { workspace = true }
# Optional: only for the `dev-unify` feature below (not used by code).
hyper = { version = "1", features = ["full"], optional = true }
hyper-util = { version = "0.1", features = ["server", "http2"], optional = true }
bitflags = { version = "2", features = ["std"], optional = true }
fastrand = { version = "2", optional = true }
slab = { version = "0.4", optional = true }
bytes = { workspace = true }
futures-util = { workspace = true }
secrecy = { workspace = true }
keyring-core = "1"
hex = { workspace = true }
# `.gitignore` matching for graph ingest scans (already in the tree via the engine).
ignore = { workspace = true }
# PR changed-file `include` globs (already in the tree via `ignore`).
globset = { workspace = true }
# artifactSearch `version` ranges (already in the lockfile via the toolchain crates).
semver = "1"
# artifactSearch reads `.cargo_vcs_info.json` from a `.crate` archive (already in the lockfile via the CLI).
flate2 = { workspace = true }
octocode-engine = { path = "../engine" }
octocode-github = { path = "../github" }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
tokio-util = { workspace = true }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
windows-native-keyring-store = "1"

# Inherits the shared floor from [workspace.lints] (root Cargo.toml). The runtime
# keeps the existing shared policy; the engine library owns its stricter
# stdout/stderr lint policy.
[lints]
workspace = true
