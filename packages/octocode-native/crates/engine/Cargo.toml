[package]
name = "octocode-engine"
version = "20.0.0"
edition = "2021"
# MSRV floor: highest stable API in use is File::try_lock/unlock (Rust 1.89).
# Enforced by clippy::incompatible_msrv; verify with a CI MSRV job.
rust-version = "1.89"
build = "build.rs"
publish = false
description = "Rust native Octocode engine for context compression, structural search, and LSP semantic navigation"
license = "MIT"
repository = "https://github.com/bgauryy/octocode-mcp"
keywords = ["napi", "llm", "context", "lsp", "nodejs"]
categories = ["development-tools", "text-processing"]

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
let_underscore_drop = "allow"   # allow intentional best-effort let _ = result; patterns

[lints.clippy]
all = { level = "deny", priority = -1 }
# Correctness / safety
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
needless_pass_by_value = "allow"   # noisy in complex match arms
# Style / idiomatic
use_self = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1"
ast-grep-core = { version = "0.45.3", optional = true }
ast-grep-config = { version = "0.45.3", optional = true }
grep-matcher = "0.1.9"
grep-pcre2 = { version = "0.1.10", optional = true }
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4"
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
oxc_allocator = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_codegen = { version = "=0.150.0", default-features = false }
oxc_minifier = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_semantic = "=0.150.0"
oxc_span = "=0.150.0"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tree-sitter = "0.27"
tree-sitter-asm = { version = "0.24", optional = true }
tree-sitter-c = "0.24"
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-cuda = { version = "0.21.2", optional = true }
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-typescript = "0.23"
url = "2"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[dev-dependencies]
criterion = { version = "0.8" }
proptest = "1"
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "structural"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "minify"
harness = false

[features]
default = ["portable-default", "napi-addon"]
portable-default = ["tree-sitter-asm", "tree-sitter-large-grammars", "tree-sitter-scala", "pcre2"]
pcre2 = ["dep:grep-pcre2"]
napi-addon = ["dep:napi", "dep:napi-derive", "dep:napi-build", "embedded-ast-grep-rewrite"]
napi-test = ["napi-addon", "napi/noop"]
embedded-ast-grep-rewrite = ["dep:ast-grep-core", "dep:ast-grep-config"]
tree-sitter-asm = ["dep:tree-sitter-asm"]
tree-sitter-cpp = ["dep:tree-sitter-cpp"]
tree-sitter-c-sharp = ["dep:tree-sitter-c-sharp"]
tree-sitter-cuda = ["dep:tree-sitter-cuda"]
tree-sitter-large-grammars = ["tree-sitter-cpp", "tree-sitter-c-sharp", "tree-sitter-cuda"]
tree-sitter-scala = ["dep:tree-sitter-scala"]

[build-dependencies]
napi-build = { version = "2", optional = true }

