[package]
name = "octocode-github"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GitHub protocol and bounded provider operations for Octocode"

# No doctests: nextest runs the tests (crates/runtime/Cargo.toml).
[lib]
doctest = false

[dependencies]
octocode-io = { path = "../io" }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }
wiremock = { workspace = true, optional = true }

[features]
# The shared wiremock mounts and responders (`mock_http`) for downstream test
# builds. octocode-native turns it on from its dev-dependencies and `dev-unify`.
test-support = ["dep:wiremock"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
