[package]
name = "octocode-tool-github"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Octocode GitHub tools"
autobins = false
autotests = false
autoexamples = false
autobenches = false

[lib]
# Unit tests stay in src (private access); nextest and libtest run no doctests,
# and `cargo shear --check-test-targets` flags one.
doctest = false

[features]
# Fixtures for dependent crates' tests. Enabled by their dev-dependencies and by
# octocode-native's `dev-unify`, never by release builds.
test-support = ["octocode-runtime-base/test-support", "octocode-tools-shared/test-support", "dep:octocode-test-support", "dep:wiremock"]

[dependencies]
octocode-test-support = { path = "../test-support", optional = true }
wiremock = { workspace = true, optional = true }
octocode-io = { path = "../io" }
octocode-contract-types = { path = "../contract-types" }
octocode-runtime-base = { path = "../runtime-base" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
# PR changed-file `include` globs (already in the tree via `ignore`).
globset = { workspace = true }
octocode-engine = { path = "../engine" }
octocode-github = { path = "../github" }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
octocode-tools-shared = { path = "../tools-shared" }

[dev-dependencies]
octocode-engine = { path = "../engine", features = ["test-hooks"] }
# Git object ids of the GraphQL blob answers the search tests serve.
sha1 = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
octocode-runtime-base = { path = "../runtime-base", features = ["test-support"] }
octocode-tools-shared = { path = "../tools-shared", features = ["test-support"] }
octocode-test-support = { path = "../test-support" }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[lints]
workspace = true
