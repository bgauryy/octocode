[workspace]
members = ["crates/engine", "crates/github", "crates/io", "crates/contract-types", "crates/runtime", "crates/cli"]
default-members = ["crates/cli"]
# libFuzzer targets: their own workspace and lockfile (fuzz/Cargo.toml).
exclude = ["fuzz"]
resolver = "3"

# Shared metadata keeps internal crates on the native npm release version.
[workspace.package]
version = "20.2.0"
edition = "2024"
# MSRV: the pinned toolchain (rust-toolchain.toml). Dependencies such as oxc
# need it, so no lower floor is claimed; CI builds and tests on this version.
rust-version = "1.99"
license = "MIT"
# Every crate is internal: the npm packages ship the binaries.
publish = false
repository = "https://github.com/bgauryy/octocode.git"

# ── Shared dependency versions ────────────────────────────────────────────────
# Dependencies shared across crates, or that are security-critical, are
# centralized. Crate-local single-consumer deps stay in their own manifest — a
# single-use version has no second place to drift to.
#
# `optional` is a per-crate concern and cannot live here. Per-crate
# `features = [...]` are additive on top of the baseline declared here (see
# tokio / windows-sys).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
url = "2"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1" }
libc = "0.2"
windows-sys = { version = "0.61" }
# http2 is intentionally omitted: it links the `h2` stack (HPACK tables, ~0.2 MB)
# and no code path relies on HTTP/2 semantics — GitHub's REST/raw endpoints all
# serve over HTTP/1.1. Re-add "http2" if a future endpoint requires h2.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "system-proxy"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = "0.3"
bytes = "1"
base64 = "0.23"
getrandom = "0.4"
secrecy = "0.10"
flate2 = "1"
toml = { version = "1", features = ["preserve_order"] }
ignore = "0.4"
globset = "0.4"
tempfile = "3"
wiremock = "0.6"

# ── Shared lint policy ────────────────────────────────────────────────────────
# The common floor every crate inherits (`[lints] workspace = true`). The
# engine adds its library-only stdout/stderr ban as an attribute in
# `crates/engine/src/lib.rs` (Cargo cannot merge a crate's own `[lints]` with
# the workspace table). Thresholds and test exemptions live in clippy.toml.
# The rustc lints below are warn-by-default; `deny` also fails a local
# `cargo build`, not only CI's `-D warnings`.
[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Correctness / safety
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Every `unsafe` block states why it is sound in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
# Suppressions are `#[expect(..., reason = "...")]`: an `expect` that stops
# firing warns, so stale suppressions surface instead of lingering.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Structure and API shape. `too_many_lines` uses clippy.toml's threshold.
manual_let_else = "warn"
unused_self = "warn"
option_option = "warn"
large_stack_arrays = "warn"
too_many_lines = "warn"
# Modules are `name.rs` + `name/`, never `name/mod.rs`.
mod_module_files = "warn"
# Style: `Self` inside impls, `copied()` over `cloned()` for `Copy` items,
# method paths over forwarding closures, `;` after unit expressions.
use_self = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"

[profile.release]
# Thin LTO recovers nearly all of fat LTO's cross-crate optimization at a
# fraction of the link time — the dominant cost when this profile is built
# once per release target across seven platforms. Benchmark before/after with the
# engine's criterion suites (structural/search/minify) and confirm binary size
# holds; revert to `true` if a hot path regresses beyond ~2%.
lto = "thin"
codegen-units = 1
strip = "symbols"

# ── Selective codegen-units (build-speed lever, ruff pattern) ─────────────────
# `codegen-units = 1` (above) maximizes runtime perf but SERIALIZES a crate's
# codegen — measured as ~107s of the ~154s release critical path for the runtime
# crate alone. The runtime is orchestration/IO, not a hot CPU loop, so it pays
# no meaningful perf cost from parallel codegen; bump it to 16. The engine holds
# the perf-critical algorithms (structural search / minify / LSP) and stays at
# the global `codegen-units = 1`.
[profile.release.package.octocode-native]
codegen-units = 16

# NOTE (measured 2026-09-22): the engine is the release long pole at the global
# cu=1 (~146s, compiled up to 3×), but it must STAY at cu=1. Benchmarked cu=1 vs
# cu=8 and cu=16 on the criterion suites: both cut the engine compile to ~28s but
# regressed CSS minify (`minify_content_view_css`) ~17-22% and search ~2% —
# beyond the ~2% gate. The minify hot paths lose cross-function inlining when the
# crate is split into more codegen units. Do NOT add a per-package
# codegen-units override for octocode-engine; the parallel-codegen build win is
# not free here.

# ── Profiling / benchmarking build ────────────────────────────────────────────
# Inherits the optimized release profile but keeps full debuginfo and drops LTO,
# so criterion runs and perf/flamegraph traces stay usable without paying the
# release link cost. Precedent: ruff `[profile.profiling]`, uv, oxc
# `[profile.release-with-debug]`. Build with `--profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false

# ── Faster inner-loop debug builds (ruff / uv / biome pattern) ────────────────
# Emit only line tables: keeps file:line in panics/backtraces but drops the bulk
# of DWARF. `split-debuginfo = "unpacked"` is already Cargo's macOS default (no
# `dsymutil` per link); setting it makes Linux split debuginfo the same way. Cross-validated against ruff/uv/biome dev profiles — ~20-40% faster debug
# rebuilds; full DWARF is only needed when stepping in a debugger (use
# `--profile profiling` for that). Dependencies below get no debuginfo at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# Every CLI process builds the secret sanitizer's literal prescan (regex-syntax
# parse + aho-corasick) and compiles its no-literal fallback patterns on first
# output. Unoptimized, that one-time init cost ~50 ms per debug tool call
# (measured 2026-10-02; ~17 ms at opt-level 3).
[profile.dev.package."regex-syntax"]
opt-level = 3
[profile.dev.package."aho-corasick"]
opt-level = 3
[profile.dev.package."regex"]
opt-level = 3

# Contract validation, row shaping and every tool result move `serde_json::Value`
# trees (clone, drop, hash-map lookups), and large-source reads hash megabytes
# per page. Unoptimised, those loops set the tail of `cargo nextest` (the union
# differential test, streamed large-source paging); opt-level 3 here took the
# union differential test from ~110 to ~70 CPU-seconds.
[profile.dev.package."serde_json"]
opt-level = 3
[profile.dev.package."sha2"]
opt-level = 3

# ── Heavy dep clusters: optimise for dev-loop runtime without slowing own-crate rebuilds ──
# Own code stays at opt-level=0 for fast incremental recompile; only dependency
# code is bumped. This mirrors the regex-automata pattern already applied above.
# tree-sitter-cpp / -c-sharp / -scala (~74 MB of generated parser.c) are left at
# opt-level 0 on purpose: `cc` follows the profile level, so -O3 on them costs
# minutes of cold dev/test build while tests only parse tiny fixtures.

[profile.dev.package."tree-sitter"]
opt-level = 3
[profile.dev.package."tree-sitter-asm"]
opt-level = 3
[profile.dev.package."tree-sitter-cuda"]
opt-level = 3
[profile.dev.package."tree-sitter-javascript"]
opt-level = 3
[profile.dev.package."tree-sitter-typescript"]
opt-level = 3
[profile.dev.package."tree-sitter-rust"]
opt-level = 3
[profile.dev.package."tree-sitter-python"]
opt-level = 3
[profile.dev.package."tree-sitter-go"]
opt-level = 3
[profile.dev.package."tree-sitter-java"]
opt-level = 3
[profile.dev.package."tree-sitter-c"]
opt-level = 3
[profile.dev.package."oxc_parser"]
opt-level = 2
[profile.dev.package."oxc_semantic"]
opt-level = 2
