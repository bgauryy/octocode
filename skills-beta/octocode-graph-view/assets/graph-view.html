<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph view</title>
<style>
:root{--bg:#fff;--panel:#f6f7f9;--ink:#15181d;--mute:#5f6b7a;--line:#d5dae1;--edge:#8a94a3;--halo:#fff;--ok:#1a7f4b;--warn:#b26a00;--bad:#c0392b;--acc:#2f6fb5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151a;--panel:#1b2028;--ink:#e6e9ee;--mute:#97a3b3;--line:#2c3440;--edge:#667180;--halo:#12151a;--ok:#4cc38a;--warn:#e0a040;--bad:#ef6a5a;--acc:#6aa5e8}}
:root[data-theme=dark]{--bg:#12151a;--panel:#1b2028;--ink:#e6e9ee;--mute:#97a3b3;--line:#2c3440;--edge:#667180;--halo:#12151a;--ok:#4cc38a;--warn:#e0a040;--bad:#ef6a5a;--acc:#6aa5e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 53px)}
#stage{position:relative;min-width:0}
#stage svg{width:100%;height:100%;display:block}
.bar{position:absolute;left:12px;top:10px;display:flex;gap:8px;align-items:center}
.bar button,.bar input,.tabs button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.bar button.on,.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
h2{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.k{cursor:pointer;color:var(--acc)} .k:hover{text-decoration:underline}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.bartrack{background:var(--line);border-radius:4px;height:8px;min-width:80px}
.bartrack i{display:block;height:8px;border-radius:4px;background:var(--acc)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.note{color:var(--mute);font-size:12px}
svg text{paint-order:stroke;stroke:var(--halo);stroke-width:4px;fill:var(--ink);font-size:14px}
svg .legend text{font-size:20px;font-weight:600}
svg .sym text{font-size:11px;stroke-width:3px}
.dim{opacity:.12}
body.shot header,body.shot aside,body.shot .bar{display:none}
body.shot main{display:block;height:1000px}
body.shot #stage{width:1600px;height:1000px}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#stage{height:70vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header><h1 id="title"></h1><span id="chips"></span></header>
<main>
  <div id="stage">
    <div class="bar">
      <button data-view="files">Files</button><button data-view="functions">Functions</button>
      <input id="q" placeholder="find file or function" aria-label="find file or function"><span id="edgekey" class="note" hidden></span>
    </div>
    <svg id="v" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Import and call graph"></svg>
  </div>
  <aside>
    <div class="tabs"><button data-tab="insights">Insights</button><button data-tab="evidence">Evidence</button><button data-tab="model">Model</button><button data-tab="tokens">Tokens</button><button data-tab="node">Node</button></div>
    <div id="panel"></div>
  </aside>
</main>
<pre id="measure" hidden></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const W = 1600, H = 1000;
const shot = new URLSearchParams(location.hash.slice(1)).get('shot');
if (shot) document.body.classList.add('shot');
const hash = new URLSearchParams(location.hash.slice(1));
let view = shot || 'files', tab = hash.get('tab') || 'insights', selected = null, flow = hash.get('flow');
let colorBy = D.model && D.model.layers.length ? 'layer' : 'group';
const upward = new Set((D.model?.upward ?? []).map((e) => `${e.source}>${e.target}`));
const layerColor = (id) => D.model?.layers.find((l) => l.id === D.model.layerOf[id])?.color;
const colorOf = (d) => (colorBy === 'layer' && layerColor(d.type === 'sym' ? d.file : d.id)) || color(d.group);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = (p) => String(p ?? '').split('/').slice(-2).join('/');
const groups = [...new Set(D.files.map((f) => f.group))];
const color = d3.scaleOrdinal(d3.schemeTableau10).domain(groups);
const R = (f) => 5 + 1.6 * Math.sqrt(f.fanIn);

if (D.mode === 'overview') document.querySelector('[data-view=functions]').style.display = 'none';
document.getElementById('title').textContent = D.section.split('/').slice(-2).join('/');
document.getElementById('chips').innerHTML = [
  `${D.snapshot.counts.nodesByKind.file} files`, `${D.snapshot.counts.nodes} nodes`, `${D.snapshot.counts.edges} edges`,
  D.snapshot.linkage != null ? `call linkage ${(D.snapshot.linkage * 100).toFixed(0)}%` : '', D.frozen ? 'frozen copy' : '',
].filter(Boolean).map((t) => `<span class="chip">${esc(t)}</span>`).join(' ');

// Layouts settle synchronously so a screenshot is deterministic.
const cache = {};
function layout(v) {
  if (cache[v]) return cache[v];
  const fileMap = new Map(D.files.map((f) => [f.id, { ...f, type: 'file' }]));
  let nodes, links;
  if (v === 'files') {
    const extra = (D.model?.nodes ?? []).map((n) => ({ id: n.id, label: n.label, type: 'ext', group: '.', fanIn: 0, fanOut: 0 }));
    nodes = [...fileMap.values(), ...extra];
    const have = new Set(nodes.map((n) => n.id));
    links = D.imports.map((e) => ({ source: e.source, target: e.target, kind: 'imp', up: upward.has(`${e.source}>${e.target}`) }))
      .concat((D.model?.edges ?? []).filter((e) => have.has(e.source) && have.has(e.target)).map((e) => ({ source: e.source, target: e.target, kind: 'rt', label: e.kind })));
  } else {
    const fnFiles = new Set(D.fnFiles);
    nodes = [...fileMap.values()].filter((f) => fnFiles.has(f.id));
    const syms = D.symbols.map((s) => ({ ...s, type: 'sym', group: fileMap.get(s.file)?.group ?? '.', label: s.name }));
    nodes = nodes.concat(syms);
    links = syms.map((s) => ({ source: s.file, target: s.id, kind: 'has' })).concat(D.calls.map((c) => ({ source: c.source, target: c.target, kind: 'call', via: c.via })));
  }
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id((d) => d.id).distance((l) => (l.kind === 'has' ? 45 : v === 'files' ? 150 : 110)))
    .force('charge', d3.forceManyBody().strength(v === 'files' ? -700 : -260))
    .force('collide', d3.forceCollide((d) => (d.type === 'sym' ? 14 : R(d) + (v === 'files' ? 45 : 30))))
    .force('x', d3.forceX(W / 2).strength(0.07)).force('y', d3.forceY(H / 2).strength(0.07)).stop();
  for (let i = 0; i < 500; i++) sim.tick();
  const fit = (k, lo, hi) => {
    const [a, b] = d3.extent(nodes, (d) => d[k]);
    nodes.forEach((d) => { d[k] = b === a ? (lo + hi) / 2 : lo + ((d[k] - a) / (b - a)) * (hi - lo); });
  };
  fit('x', 40, W - 240);
  fit('y', 110, H - 40);
  return (cache[v] = { nodes, links });
}

const svg = d3.select('#v');
svg.append('defs').append('marker').attr('id', 'ar').attr('viewBox', '0 0 10 10').attr('refX', 16).attr('refY', 5)
  .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto').append('path').attr('d', 'M0,0L10,5L0,10z').attr('fill', 'var(--edge)');
const world = svg.append('g');
const legendG = svg.append('g').attr('class', 'legend');
if (!shot) svg.call(d3.zoom().scaleExtent([0.4, 6]).on('zoom', (e) => world.attr('transform', e.transform)));
let sel = {};

function draw() {
  const { nodes, links } = layout(view);
  world.selectAll('*').remove();
  const L = world.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', (d) => (d.up ? 'var(--bad)' : d.kind === 'rt' ? 'var(--acc)' : d.via === 'lsp' ? 'var(--ok)' : d.via === 'graph' && D.callStats?.mode === 'both' && D.callStats?.resolved ? 'var(--warn)' : 'var(--edge)')).attr('stroke-opacity', (d) => (d.kind === 'has' ? 0.25 : 0.7))
    .attr('stroke-width', (d) => (d.kind === 'call' ? 1.4 : d.kind === 'rt' || d.up ? 1.8 : 1)).attr('stroke-dasharray', (d) => (d.kind === 'rt' ? '5 3' : d.up ? '4 3' : null))
    .attr('marker-end', (d) => (d.kind === 'has' ? null : 'url(#ar)'))
    .attr('x1', (d) => d.source.x).attr('y1', (d) => d.source.y).attr('x2', (d) => d.target.x).attr('y2', (d) => d.target.y);
  const N = world.append('g').selectAll('g').data(nodes).join('g').attr('class', (d) => d.type).attr('transform', (d) => `translate(${d.x},${d.y})`)
    .style('cursor', 'pointer').on('click', (_, d) => { selected = d.id; tab = 'node'; render(); focus(d.id); });
  N.each(function (d) {
    const g = d3.select(this);
    if (d.type === 'sym') g.append('path').attr('d', d3.symbol(d.exported ? d3.symbolDiamond : d3.symbolCircle, 90)()).attr('fill', colorOf(d)).attr('stroke', 'var(--bg)');
    else if (d.type === 'ext') g.append('rect').attr('x', -9).attr('y', -9).attr('width', 18).attr('height', 18).attr('fill', layerColor(d.id) || 'var(--mute)');
    else g.append('circle').attr('r', R(d)).attr('fill', colorOf(d));
    g.append('text').text(d.label).attr('x', (d.type === 'sym' ? 8 : d.type === 'ext' ? 14 : R(d) + 4)).attr('y', 4);
  });
  sel = { L, N, links };
  declutter();
  measure();
  legendG.selectAll('text').data(D.legends[view]).join('text').text((d) => d).attr('x', 20).attr('y', (d, i) => 36 + i * 28);
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  const key = document.getElementById('edgekey'), cs = D.callStats;
  key.hidden = !(view === 'functions' && cs?.mode === 'both' && cs.resolved);
  key.textContent = 'call edges: green = language server only, amber = graph only, grey = both';
  focus(selected);
}

// Place labels greedily by priority; a label that would collide is hidden and kept as a hover title.
function declutter() {
  const placed = [], rank = (d) => (d.type === 'sym' ? (d.exported ? 1 : 2) + 0.01 * (d.calls ? 0 : 1) : 0);
  const items = [];
  sel.N.each(function (d) { items.push({ d, el: this, t: this.querySelector('text') }); });
  items.sort((a, b) => rank(a.d) - rank(b.d));
  for (const it of items) {
    const b = it.t.getBBox(), box = { x: it.d.x + b.x, y: it.d.y + b.y, w: b.width, h: b.height };
    const hit = placed.some((p) => Math.min(p.x + p.w, box.x + box.w) - Math.max(p.x, box.x) > 1 && Math.min(p.y + p.h, box.y + box.h) - Math.max(p.y, box.y) > 1);
    if (hit) { it.t.style.display = 'none'; d3.select(it.el).append('title').text(it.d.label); }
    else placed.push(box);
  }
}

// Label boxes measured in the browser: layout facts a model should not guess from pixels.
function measure() {
  const boxes = [];
  let hidden = 0;
  sel.N.each(function (d) {
    const t = this.querySelector('text');
    if (t.style.display === 'none') { hidden++; return; }
    const b = t.getBBox();
    boxes.push({ id: d.id, label: d.label, x: d.x + b.x, y: d.y + b.y, w: b.width, h: b.height, cx: d.x, cy: d.y, r: d.type === 'sym' ? 5 : d.type === 'ext' ? 9 : R(d) });
  });
  const hit = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  const labelOverlaps = [], labelOnNode = [];
  boxes.forEach((a, i) => {
    boxes.slice(i + 1).forEach((b) => { const area = hit(a, b); if (area > 4) labelOverlaps.push({ a: a.id, b: b.id, area: Math.round(area) }); });
    boxes.forEach((n) => {
      if (n.id === a.id) return;
      const nx = Math.max(a.x, Math.min(n.cx, a.x + a.w)), ny = Math.max(a.y, Math.min(n.cy, a.y + a.h));
      if (Math.hypot(nx - n.cx, ny - n.cy) < n.r) labelOnNode.push({ label: a.id, node: n.id });
    });
  });
  const clipped = boxes.filter((b) => b.x < 0 || b.y < 0 || b.x + b.w > W || b.y + b.h > H).map((b) => b.id);
  document.getElementById('measure').textContent = JSON.stringify({
    view, width: W, height: H,
    labels: boxes.map((b) => ({ id: b.id, label: b.label, x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h), cx: Math.round(b.cx), cy: Math.round(b.cy) })),
    labelOverlaps, labelOnNode, clipped, hidden,
  });
}

function focus(id) {
  if (!sel.N) return;
  const term = document.getElementById('q').value.trim().toLowerCase();
  const keep = new Set();
  const fl = D.model?.flows.find((x) => x.id === flow);
  if (fl) {
    fl.steps.forEach((st) => { keep.add(st.from); keep.add(st.to); });
    sel.N.classed('dim', (d) => !keep.has(d.id));
    sel.L.classed('dim', (l) => !(keep.has(l.source.id) && keep.has(l.target.id)));
    return;
  }
  if (id) { keep.add(id); sel.links.forEach((l) => { if (l.source.id === id) keep.add(l.target.id); if (l.target.id === id) keep.add(l.source.id); }); }
  const match = (d) => !term || d.id.toLowerCase().includes(term) || (d.label || '').toLowerCase().includes(term);
  sel.N.classed('dim', (d) => (id ? !keep.has(d.id) : !match(d)));
  sel.L.classed('dim', (l) => (id ? !(l.source.id === id || l.target.id === id) : !!term));
}

const bytes = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1)} MB` : n >= 1e3 ? `${(n / 1e3).toFixed(1)} KB` : `${n} B`);
const pct = (p) => `<span class="${p >= 0.7 ? 'bad' : p >= 0.3 ? 'warn' : 'ok'}">${p.toFixed(2)}</span>`;
const link = (id) => `<span class="k mono" data-focus="${esc(id)}">${esc(short(id))}</span>`;

const tag = { risk: 'bad', warn: 'warn', info: 'note' };
function insights() {
  const I = D.insights, h = I.health || {};
  const chunks = D.chunks ? `<h2>Chunks (${D.chunks.length})</h2><table><tr><th>path</th><th>files</th><th>built</th></tr>${D.chunks.map((c) => `<tr><td class="mono">${esc(c.path)}${c.package ? `<div class="note">${esc(c.package)}</div>` : ''}</td><td>${c.files}</td><td>${c.built ? '<span class="ok">yes</span>' : c.error ? `<span class="warn" title="${esc(c.error)}">failed</span>` : '<span class="note">no</span>'}</td></tr>`).join('')}</table><p class="note">One graph snapshot has a file budget, so each chunk is its own snapshot. Links are workspace-package imports seen from each built chunk's busiest files.</p>` : '';
  return `${chunks}<h2>Key insights</h2><ul>${(D.synth || []).map((x) => `<li><span class="${tag[x.level]}">${esc(x.level)}</span> ${esc(x.text)} <span class="note">[${esc(x.layers.join(' + '))}]</span></li>`).join('') || '<li class="note">none</li>'}</ul>
    <h2>Health</h2><table>
    <tr><td>Files analysed</td><td>${h.files ?? '-'}</td></tr><tr><td>Files in import cycles</td><td>${h.filesInCycles ?? '-'}</td></tr>
    <tr><td>Average reach</td><td>${h.averageReach ?? '-'}</td></tr><tr><td>Normalized cumulative dependency</td><td>${h.nccd ?? '-'}</td></tr></table>
    <h2>Hubs (fan-in / fan-out)</h2><table>${I.hubs.map((x) => `<tr><td>${link(x.id)}</td><td>${x.fanIn} / ${x.fanOut}</td></tr>`).join('')}</table>
    <h2>Import cycles (${I.cycles.total})</h2><table>${I.cycles.top.map((c) => `<tr><td>${c.size} files${c.runtime ? ' (runtime)' : ''}</td><td>${c.nodes.slice(0, 3).map(link).join('<br>')}${c.size > 3 ? '<br><span class="note">+' + (c.size - 3) + ' more</span>' : ''}</td></tr>`).join('')}</table>
    <h2>Findings by detector</h2><table>${Object.entries(I.findings).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>
    <h2>Top ranked findings</h2><table>${I.issues.map((x) => `<tr><td>${link(x.subject)}</td><td>${esc(x.detector)}: ${esc(x.title)}</td></tr>`).join('')}</table>
    <h2>Group coupling in view</h2>${I.mutualGroups.length ? `<p class="warn">Mutual imports: ${I.mutualGroups.map((p) => esc(p.join(' ↔ '))).join(', ')}</p>` : '<p class="ok">No two groups import each other in this view.</p>'}
    <table>${I.groups.sort((a, b) => b.count - a.count).map((c) => `<tr><td>${esc(c.from)} → ${esc(c.to)}</td><td>${c.count}</td></tr>`).join('')}</table>
    <p class="note">Findings are ranked hypotheses from syntax-derived graph analysis; confirm identity with LSP before acting.</p>`;
}

const good = (p) => `<span class="${p >= 0.7 ? 'ok' : p >= 0.3 ? 'warn' : 'bad'}">${p.toFixed(2)}</span>`;
const chip = (v) => `<span class="${{ corroborated: 'bad', conflict: 'warn', unused: 'warn', unresolved: 'warn', unconfirmed: 'warn', dismissed: 'ok', 'not-supported': 'ok', reexport: 'note' }[v] || 'note'}">${esc(v)}</span>`;
const sig = (l) => {
  const s = l.signals, bits = [];
  if (s.source) bits.push(`ast ${esc(s.source.ast)}; ${s.source.usageLines} uses, ${s.source.callLike} call-like`);
  if (s.clasify) bits.push(Object.entries(s.clasify).map(([k, p]) => `${esc(k)} ${pct(p)}`).join(' '));
  if (s.image) bits.push(`image: drawn ${good(s.image.drawn)} readable ${good(s.image.readable)}`);
  if (s.structure) bits.push(`${s.structure.lines} lines, ${s.structure.owners} owners`);
  if (s.lsp) bits.push(`lsp ${esc(s.lsp.status)} ${esc(s.lsp.note || '')}`);
  return bits.join('<br>');
};
function evidence() {
  const V = D.verify;
  if (!V) return '<p class="note">No evidence yet. Run render with --shot, then verify.mjs, then render again.</p>';
  const R = V.render, o = R.ocr;
  const lay = (name, m) => m ? `<tr><td>${name}</td><td>${m.overlaps}</td><td>${m.labelOnNode}</td><td>${m.clipped}</td><td>${m.hidden}</td></tr>` : '';
  return `<h2>Leads: graph + source + clasify</h2>
    <table>${V.leads.map((l) => `<tr><td>${chip(l.verdict)}<div class="note">${esc(l.detector)}</div></td>
      <td>${link(l.file)}${l.target ? ` → ${link(l.target)}<span class="note"> :${l.line}</span>` : ''}${l.signals.source ? `<div class="mono note">${esc(l.signals.source.snippet)}</div>` : ''}<div class="note">${esc(l.why)}</div></td><td>${sig(l)}</td></tr>`).join('')}</table>
    <p class="note">corroborated: independent layers agree; dismissed: soft dependency; conflict: layers disagree; unused: imported names never used. Probabilities are clasify P(yes).</p>
    ${V.connections ? `<h2>Connections</h2><p>The parsed AST confirms <b>${V.connections.confirmed} of ${V.connections.checked}</b> graph import edges in view (${V.connections.viaImport} by import statement, ${V.connections.viaPath} by inline path)${V.connections.unconfirmed.length ? `; unconfirmed: ${V.connections.unconfirmed.map((e) => `${link(e.source)} → ${link(e.target)}`).join(', ')}` : ''}.${V.connections.mutual.length ? ` Mutual imports: ${V.connections.mutual.map((p) => p.map(link).join(' ↔ ')).join('; ')}.` : ''}</p>` : ''}
    ${V.history ? `<h2>History</h2><p class="note">${V.history.quality.commits} commits touch this section; ${V.history.quality.small} touch at most ${V.history.quality.maxCommitFiles} files (median ${V.history.quality.medianFiles}); strongest co-change pair: ${V.history.quality.maxPair}x.</p>
    <table><tr><th>hotspot</th><th>importers</th><th>commits</th><th>90 days</th></tr>${V.history.hotspots.map((h) => `<tr><td>${link(h.id)}</td><td>${h.fanIn}</td><td>${h.commits}</td><td>${h.recent90}</td></tr>`).join('')}</table>
    ${V.history.coChange.length ? `<table>${V.history.coChange.map((c) => `<tr><td>${link(c.a)} + ${link(c.b)}</td><td>${c.count}x</td><td>${c.imported ? 'imported' : '<span class="warn">no import</span>'}</td></tr>`).join('')}</table>` : ''}
    ${V.history.top?.length ? `<p class="note">Most changed files in the section: ${V.history.top.map((t) => `${link(t.id)} (${t.commits})`).join(', ')}.</p>` : ''}
    ${V.history.remote ? `<p class="note">GitHub history for the top hotspots: ${V.history.remote.map((r) => `${esc(short(r.id))} ${r.error ? 'error' : r.commits + ' commits'}`).join(', ')}.</p>` : ''}` : ''}
    <h2>Render fidelity</h2>
    <table><tr><th>view</th><th>label overlaps</th><th>label on node</th><th>clipped</th><th>hidden</th></tr>${lay('Files', R.layout?.files)}${lay('Functions', R.layout?.functions)}</table>
    <p class="note">Measured in the browser (DOM), not judged from pixels.${R.layout?.functions && R.layout.functions.worst.length ? ` Worst overlaps: ${R.layout.functions.worst.slice(0, 3).map((x) => `${esc(short(x.a))} / ${esc(short(x.b))}`).join('; ')}.` : ''}</p>
    ${o ? `<p>OCR (${esc(o.model)}, ${(o.ms / 1000).toFixed(1)} s): ${o.readWhole} of ${o.expected} labels read from the Files image${o.recovered.length ? `, ${o.recovered.length} more by cropping (${o.recovered.map(esc).join(', ')})` : ''}.${o.stillMissing.length ? ` <span class="warn">Unread: ${o.stillMissing.map(esc).join(', ')}</span>` : ''}</p>` : ''}
    <h2>Layers run</h2><table>${Object.entries(V.layers).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="${v === 'ok' ? 'ok' : v === 'off' ? 'note' : 'warn'}">${esc(v)}</td></tr>`).join('')}</table>
    <p class="note">Evidence checks what the graph claims and what was rendered; every lead still needs an exact source read before action.</p>`;
}

const ev = (e) => `<span class="mono">${esc(e?.path ?? '')}:${esc(e?.line ?? '')}</span>`;
function modelTab() {
  const m = D.model;
  if (!m) return '<p class="note">No overlay. Write model.json (see references/modeling.md) and render with --model.</p>';
  const count = (id) => Object.values(m.layerOf).filter((x) => x === id).length;
  const fl = m.flows.find((x) => x.id === flow);
  return `${m.meta.summary ? `<h2>Summary</h2><p>${esc(m.meta.summary)}</p>` : ''}
    <h2>Layers ${m.layers.length ? `<span class="note">colored by ${colorBy}</span> <span class="k" data-colorby>switch</span>` : ''}</h2>
    <table>${m.layers.map((l) => `<tr><td><span style="color:${esc(l.color)}">■</span> ${esc(l.label)}${l.exempt ? ' <span class="note">(exempt)</span>' : ''}</td><td>${count(l.id)} files</td></tr>`).join('') || '<tr><td class="note">none declared</td></tr>'}</table>
    <h2>Upward imports (${m.upward.length}, candidates)</h2><table>${m.upward.map((e) => `<tr><td>${link(e.source)} → ${link(e.target)}</td><td>:${e.line}</td></tr>`).join('') || '<tr><td class="ok">none</td></tr>'}</table>
    <p class="note">Run the Hypothesis test on each before calling it a defect; legitimate ones go in allowed.</p>
    <h2>Flows</h2><table>${m.flows.map((x) => `<tr><td><span class="k" data-flow="${esc(x.id)}">${esc(x.name)}</span></td><td>${x.steps.length} steps</td></tr>`).join('') || '<tr><td class="note">none</td></tr>'}</table>
    ${fl ? `<ol>${fl.steps.map((st) => `<li>${link(st.from)} → ${link(st.to)}: ${esc(st.action)}${st.async ? ' <i>(async)</i>' : ''}<br>${ev(st.evidence)}</li>`).join('')}</ol><p><span class="k" data-flow="">clear flow</span></p>` : ''}
    <h2>Runtime edges (${m.edges.length})</h2><table>${m.edges.map((e) => `<tr><td>${link(e.source)} → ${link(e.target)}<div class="note">${esc(e.kind)}${e.action ? ': ' + esc(e.action) : ''}</div></td><td>${ev(e.evidence)}</td></tr>`).join('') || '<tr><td class="note">none</td></tr>'}</table>
    <h2>Findings</h2><table>${m.findings.map((x) => `<tr><td><span class="${x.confidence === 'confirmed' ? 'ok' : x.confidence === 'likely' ? 'warn' : 'note'}">${esc(x.confidence)}</span></td><td>${esc(x.title)}${x.detail ? `<div class="note">${esc(x.detail)}</div>` : ''}${(x.evidence ?? []).map((e) => `<div>${ev(e)}</div>`).join('')}</td></tr>`).join('') || '<tr><td class="note">none</td></tr>'}</table>
    ${m.warnings.length ? `<h2>Model warnings</h2><ul>${m.warnings.map((w) => `<li class="warn">${esc(w)}</li>`).join('')}</ul>` : ''}`;
}

function tokens() {
  const T = D.tokens, rows = T.rows, max = Math.log10(Math.max(...rows.map((r) => r.tokens)) + 1);
  return `<h2>What an agent reads</h2><table>${rows.map((r) => `<tr><td>${esc(r.name)}<div class="note">${esc(r.note)}</div></td><td>~${r.tokens.toLocaleString()}</td><td><div class="bartrack"><i style="width:${(Math.log10(r.tokens + 1) / max) * 100}%"></i></div></td></tr>`).join('')}</table>
    ${T.sourceBytes ? `<p>The brief is <b>${T.ratio.toLocaleString()}×</b> smaller than the ${T.sourceFiles.toLocaleString()} source files (${bytes(T.sourceBytes)}). Bars are log-scaled.</p>` : '<p>Bars are log-scaled.</p>'}
    <p class="note">Tokens are estimated: text at 4 bytes per token, images at width×height/750. The brief is lossy; follow a lead with an exact read before relying on it. Clasify judged ${T.clasifyInput.toLocaleString()} tokens outside the agent's context.</p>`;
}

function nodeTab() {
  const n = layout(view).nodes.find((x) => x.id === selected) || layout('files').nodes.find((x) => x.id === selected);
  if (!n) return '<p class="note">Click a node.</p>';
  const all = [...D.imports, ...D.calls], out = all.filter((e) => e.source === n.id), inn = all.filter((e) => e.target === n.id);
  const list = (a, k) => a.map((e) => `<tr><td>${link(e[k])}</td></tr>`).join('') || '<tr><td class="note">none in view</td></tr>';
  return `<h2>${n.type === 'sym' ? 'Function' : 'File'}</h2><p class="mono">${esc(n.id)}</p>
    ${n.type === 'sym' ? `<p>${esc(n.kind)}${n.line ? ` at line ${n.line}` : ''}${n.exported ? ', exported' : ''}; ${n.calls} outgoing calls</p>` : `<p>fan-in ${n.fanIn}, fan-out ${n.fanOut}</p>`}
    ${n.href ? `<p><a href="${esc(n.href)}" target="_blank" rel="noopener">open this chunk's report</a></p>` : n.type === 'file' && D.mode === 'overview' ? '<p class="note">Not built yet.</p>' : ''}
    <h2>Uses</h2><table>${list(out, 'target')}</table><h2>Used by</h2><table>${list(inn, 'source')}</table>`;
}

function render() {
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelector('[data-tab=model]').style.display = D.model ? '' : 'none';
  document.getElementById('panel').innerHTML = { insights, evidence, tokens, model: modelTab, node: nodeTab }[tab]();
  document.querySelectorAll('[data-flow]').forEach((e) => e.addEventListener('click', () => { flow = e.dataset.flow || null; selected = null; if (flow) view = 'files'; draw(); render(); }));
  document.querySelectorAll('[data-colorby]').forEach((e) => e.addEventListener('click', () => { colorBy = colorBy === 'layer' ? 'group' : 'layer'; draw(); render(); }));
  document.querySelectorAll('[data-focus]').forEach((e) => e.addEventListener('click', () => {
    selected = e.dataset.focus;
    if (!layout(view).nodes.some((n) => n.id === selected)) view = 'files';
    tab = 'node'; draw(); render();
  }));
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; selected = null; draw(); render(); }));
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
document.getElementById('q').addEventListener('input', () => focus(selected));
draw();
if (!shot) render();
document.title = shot ? 'ready' : `Graph view: ${D.section.split('/').slice(-1)[0]}`;
</script>
</body>
</html>
