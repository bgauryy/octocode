name: Agents communication

on:
  push:
    branches: [main]
    paths:
      - 'skills/octocode-agents-communication/**'
      - 'packages/octocode-agents-communication/**'
      - 'packages/octocode-config/python/**'
      - 'packages/octocode-mcp-cli/**'
      - 'yarn.lock'
      - '.github/workflows/agents-communication.yml'
  pull_request:
    paths:
      - 'skills/octocode-agents-communication/**'
      - 'packages/octocode-agents-communication/**'
      - 'packages/octocode-config/python/**'
      - 'packages/octocode-mcp-cli/**'
      - 'yarn.lock'
      - '.github/workflows/agents-communication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-communication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Python / ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64-python3.14
          - runner: macos-15-intel
            target: darwin-x64-python3.14
          - runner: ubuntu-24.04-arm
            target: linux-arm64-python3.14
          - runner: ubuntu-24.04
            target: linux-x64-python3.14
          - runner: windows-11-arm
            target: win32-arm64-python3.14
          - runner: windows-2022
            target: win32-x64-python3.14
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: packages/octocode-agents-communication
    env:
      COMMUNICATION_EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install workspace dependencies
        working-directory: .
        run: corepack enable && yarn install --immutable --mode=skip-build
      - name: Python syntax and protocol tests
        run: |
          node src/check-syntax.mjs
          node src/test-python.mjs
      - name: Build and test the extracted portable archive
        run: |
          node src/build.mjs
          node src/release-smoke.mjs --output out/release-smoke.json
      # POSIX vendor fixtures run on Unix; the extracted CLI/MCP/DB smoke
      # and PowerShell launcher execute on every Windows runner too.
      - name: Node process and integration tests
        if: runner.os != 'Windows'
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Markdown links resolve and are not gitignored
        if: matrix.target == 'linux-x64-python3.14'
        run: node src/check-links.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: communication-${{ matrix.target }}
          path: |
            packages/octocode-agents-communication/out/release-smoke.json
            packages/octocode-agents-communication/out/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  minimum-python:
    name: Declared Python 3.9 minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/octocode-agents-communication
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9'
      - name: Install workspace dependencies
        working-directory: .
        run: corepack enable && yarn install --immutable --mode=skip-build
      - run: node src/build.mjs && node src/test-python.mjs && node src/release-smoke.mjs
