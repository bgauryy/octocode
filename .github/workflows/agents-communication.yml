name: Agents communication native release gates

on:
  push:
    branches: [main]
    paths:
      - 'packages/octocode-agents-communication/**'
      - 'docs/COMMUNICATION_RETIREMENT.md'
      - 'packages/octocode-config/rust/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.github/workflows/agents-communication.yml'
  pull_request:
    paths:
      - 'packages/octocode-agents-communication/**'
      - 'docs/COMMUNICATION_RETIREMENT.md'
      - 'packages/octocode-config/rust/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.github/workflows/agents-communication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-communication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: packages/octocode-agents-communication
    env:
      COMMUNICATION_EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, pinned compiler
        with:
          toolchain: 1.96.1-${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: packages/octocode-agents-communication -> target
      - name: Rust format, lint and protocol tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build release and test the extracted native archive
        run: |
          node scripts/build-skill.mjs --release
          node scripts/release-smoke.mjs --output out/release-smoke.json
          node --test tests/release-evidence.test.mjs
      # Product and tooling tests drive the release binary installed under
      # skills/.../scripts/bin/<host>. Every matrix runner is native (host ==
      # target), but the process tests use POSIX launchers and /bin/sh fixtures,
      # so Windows keeps only the release-evidence tests above.
      - name: Node process, integration and tooling tests
        if: runner.os != 'Windows'
        run: node --test --test-concurrency=1 tests/*.test.mjs tests/tooling/*.test.mjs
      - name: Markdown links resolve and are not gitignored
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node scripts/check-links.mjs ../../docs/COMMUNICATION_RETIREMENT.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: communication-${{ matrix.target }}
          path: |
            packages/octocode-agents-communication/out/release-smoke.json
            packages/octocode-agents-communication/out/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  minimum-rust:
    name: Declared Rust 1.89 minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.89.0'
      - run: cargo check --locked
        working-directory: packages/octocode-agents-communication

  dependency-audit:
    name: Rust dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.96.1'
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --json > audit.json
        working-directory: packages/octocode-agents-communication
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: communication-dependency-audit
          path: packages/octocode-agents-communication/audit.json
          if-no-files-found: error

  release-evidence:
    name: Verify all six native artifact receipts
    needs: [native, minimum-rust, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: communication-*
          path: release-artifacts
      - name: Match tested revision, target receipts and archive hashes
        run: node packages/octocode-agents-communication/scripts/verify-release-evidence.mjs release-artifacts "$GITHUB_SHA" > release-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: communication-release-verification
          path: release-verification.json
          if-no-files-found: error
