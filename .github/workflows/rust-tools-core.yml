name: Octocode Native — Build, Test & Package

on:
  pull_request:
    paths:
      - 'packages/octocode-native/**'
      - 'packages/octocode-engine/src/**'
      - 'packages/octocode-engine/Cargo.toml'
      - '.github/workflows/rust-tools-core.yml'
  push:
    branches: [main]
    paths:
      - 'packages/octocode-native/**'
      - 'packages/octocode-engine/src/**'
      - 'packages/octocode-engine/Cargo.toml'
      - '.github/workflows/rust-tools-core.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} — test & clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
      - name: Test
        working-directory: packages/octocode-native
        run: cargo test --all-targets
        env:
          RUST_BACKTRACE: 1
      - name: Clippy
        working-directory: packages/octocode-native
        run: cargo clippy --all-targets -- -D warnings

  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            os: ubuntu-latest
          - target: linux-x64-musl
            os: ubuntu-latest
            rustTarget: x86_64-unknown-linux-musl
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: win32-x64-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.rustTarget }}
      - name: Install musl toolchain
        if: matrix.target == 'linux-x64-musl'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
          key: ${{ matrix.target }}
      - run: corepack enable
      - run: yarn install --immutable
      - name: Build package
        run: yarn workspace @octocodeai/octocode-native build:${{ matrix.target }}
      - name: Verify package
        working-directory: packages/octocode-native/npm/${{ matrix.target }}
        run: node ../verify-binary.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: octocode-native-${{ matrix.target }}
          path: packages/octocode-native/npm/${{ matrix.target }}
          if-no-files-found: error
