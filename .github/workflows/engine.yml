name: Native Engine — Rust and N-API Tests

on:
  pull_request:
    paths:
      - 'packages/octocode-native/crates/engine/**'
      - 'packages/octocode-native/js/engine.*'
      - 'packages/octocode-native/tests/engine/**'
      - 'packages/octocode-native/scripts/check-engine-*.cjs'
      - '.github/workflows/engine.yml'
  push:
    branches: [main]
    paths:
      - 'packages/octocode-native/crates/engine/**'
      - 'packages/octocode-native/js/engine.*'
      - 'packages/octocode-native/tests/engine/**'
      - 'packages/octocode-native/scripts/check-engine-*.cjs'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine Rust and native parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
      - name: Build engine addon
        run: yarn workspace @octocodeai/octocode-native build:engine:dev
      - name: Verify N-API ABI
        run: yarn workspace @octocodeai/octocode-native verify:napi-abi
      - name: Clippy
        working-directory: packages/octocode-native
        run: cargo clippy -p octocode-engine --all-targets --all-features -- -D warnings
      - name: Cargo tests
        working-directory: packages/octocode-native
        run: cargo test -p octocode-engine --all-features
      - name: Node parity tests
        env:
          OCTOCODE_REQUIRE_NATIVE: '1'
        run: yarn workspace @octocodeai/octocode-native test:node
