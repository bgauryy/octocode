name: Native Engine — Rust Tests

on:
  pull_request:
    paths:
      - 'packages/octocode-native/crates/engine/**'
      - 'packages/octocode-native/Cargo.toml'
      - 'packages/octocode-native/Cargo.lock'
      - '.github/workflows/engine.yml'
  push:
    branches: [main]
    paths:
      - 'packages/octocode-native/crates/engine/**'
      - 'packages/octocode-native/Cargo.toml'
      - 'packages/octocode-native/Cargo.lock'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Set up mold linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
      - name: Format check
        working-directory: packages/octocode-native
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: packages/octocode-native
        run: cargo clippy --locked -p octocode-engine --all-targets --all-features -- -D warnings
      - name: Cargo tests
        working-directory: packages/octocode-native
        run: cargo test --locked -p octocode-engine --all-features

  coverage:
    name: Engine line coverage (informational)
    runs-on: ubuntu-latest
    # Coverage is a visibility signal, not a gate: it must never block an
    # engine change, so failures here don't fail the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage summary
        working-directory: packages/octocode-native
        run: cargo llvm-cov -p octocode-engine --all-features --summary-only
