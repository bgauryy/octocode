name: CI - Lint, Build & Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Build must run before Lint/Docs/Typecheck/Test because packages consume
      # compiled sibling outputs and native Node tests require host addons.
      - name: Build
        # build:ci builds the consolidated host runtime and engine addons once,
        # then compiles dependent packages.
        run: yarn build:ci

      - name: Verify docs
        run: yarn docs:verify

      - name: Lint
        # Native Rust/clippy runs in the target-specific native workflows.
        run: yarn lint:ci

      - name: Verify build outputs
        run: node scripts/workspace-health.mjs check-outputs

      - name: Typecheck
        run: yarn typecheck:ci

      - name: Test
        run: yarn test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: packages/*/coverage/
          retention-days: 7
