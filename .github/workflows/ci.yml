name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      OCTOCODE_NO_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Lint
        run: node skills-dev/octocode-dev/scripts/dev.mjs lint:ci
      - name: Typecheck
        run: node skills-dev/octocode-dev/scripts/dev.mjs typecheck:ci
      - name: Test
        run: node skills-dev/octocode-dev/scripts/dev.mjs test:ci

  native:
    name: Native (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/octocode-native
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml, so the pinned toolchain is the one used here.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
        working-directory: .
      # Every Rust dev tool installs at its dev-tools.json pin (the one pin manifest).
      - name: Pinned Rust dev tools
        id: pins
        run: |
          gates=$(node ../../skills-dev/octocode-dev/scripts/rust-quality.mjs pins cargo-deny cargo-nextest cargo-shear)
          typify=$(node ../../skills-dev/octocode-dev/scripts/rust-quality.mjs pins cargo-typify)
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "typify=$typify" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.pins.outputs.gates }}
      # The native package scripts, unchanged: the same commands run locally.
      - name: Format
        run: yarn fmt:rust:check
      - name: Clippy
        run: yarn lint
      - name: Test (nextest)
        run: yarn test:rust
        env:
          NEXTEST_PROFILE: ci
      - name: Supply chain (deny)
        run: yarn deny
      - name: Unused dependencies and test targets (shear)
        run: yarn shear
      # Contract freshness: regenerate the whole generated Rust types file with
      # the pinned cargo-typify and byte-compare it, then the config contract.
      - uses: actions/cache@v4
        id: typify
        with:
          path: ~/.cargo/bin/cargo-typify
          key: ${{ steps.pins.outputs.typify }}-${{ runner.os }}
      - name: Install cargo-typify
        if: steps.typify.outputs.cache-hit != 'true'
        run: cargo install --locked ${{ steps.pins.outputs.typify }}
      - name: Tool contract freshness
        run: yarn workspace @octocodeai/config check:tool-contract
        working-directory: .
      - name: Config contract freshness
        run: yarn workspace @octocodeai/config check:config-contract
        working-directory: .

  # Every platform's cfg(target_os)/cfg(windows) code, type-checked through the
  # same cross tools a release uses (build-native.cjs --check: no link, no
  # staging). Darwin needs the Apple SDK, so a macOS runner checks the darwin
  # entries of bin/platform.cjs and Linux checks the rest.
  native-platforms:
    name: Native type-check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packages/octocode-native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Platforms this runner checks
        id: platforms
        run: |
          node -e '
            const { PLATFORMS } = require("./bin/platform.cjs");
            const mine = Object.entries(PLATFORMS).filter(([, p]) => (p.os === "darwin") === (process.platform === "darwin"));
            console.log(`names=${mine.map(([name]) => name).join(" ")}`);
            console.log(`triples=${mine.map(([, p]) => p.triple).join(" ")}`);
          ' >> "$GITHUB_OUTPUT"
      # rustup reads rust-toolchain.toml; the targets are this runner's platforms.
      - run: rustup target add ${{ steps.platforms.outputs.triples }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
          key: platforms
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - if: runner.os == 'Linux'
        name: Pinned Rust dev tools
        id: pins
        run: |
          cross=$(node ../../skills-dev/octocode-dev/scripts/rust-quality.mjs pins cargo-zigbuild cargo-xwin)
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.pins.outputs.cross }}
      # A libc-only cross (musl on the glibc runner) uses the host toolchain.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}
      - name: Type-check
        run: node scripts/build-native.cjs --check --jobs 2 $(printf -- '--target %s ' ${{ steps.platforms.outputs.names }})

  # The Windows job object, run for real: the containment tests re-execute their
  # own test binary as a child with a grandchild and assert that no process
  # survives a bounded-run timeout, a cancelled gh token lookup, a closed job
  # and the LSP memory cap. Everything else in the Rust suite runs on the
  # `native` job; `native-platforms` only type-checks Windows.
  native-windows:
    name: Native Windows containment
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: packages/octocode-native
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml, so the pinned toolchain is the one used here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
          key: windows-containment
      # The LSP memory-cap test runs a node fake language server.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pinned Rust dev tools
        id: pins
        run: |
          nextest=$(node ../../skills-dev/octocode-dev/scripts/rust-quality.mjs pins cargo-nextest)
          echo "nextest=$nextest" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.pins.outputs.nextest }}
      - name: Job object and LSP memory cap (engine)
        run: >-
          cargo nextest run --locked -p octocode-engine
          -E 'test(/process::tests::job::/) | test(a_server_over_its_memory_cap_and_its_child_do_not_outlive_stop)'
      - name: Bounded run and token lookup containment (runtime)
        run: >-
          cargo nextest run --locked -p octocode-native --lib
          -E 'test(/bounded_process::(held_pipe_tests|gated::tests)::/) | test(/discovery::containment_tests::/)'

  # The native package's TypeScript check and script tests (platform map,
  # build/publication, lint floor, audit-native): plain Node, no Rust build.
  native-scripts:
    name: Native scripts (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Typecheck (JS loader typings and tests)
        run: yarn workspace @octocodeai/octocode-native typecheck
      - name: Script tests
        run: yarn workspace @octocodeai/octocode-native test:scripts
      - name: audit-native tests
        run: node --test packages/octocode-native/tests/audit-native.test.mjs

  # End-to-end tool health (dev.mjs test:tools): every tool through the built CLI
  # and MCP server against hermetic fixtures and a loopback mock. It needs the
  # native binary, so it runs after the native job passes, on its own build.
  e2e:
    name: E2E tool health (${{ matrix.runner }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-native
      - run: yarn install --immutable --mode=skip-build
      - name: Build (dev)
        run: node skills-dev/octocode-dev/scripts/dev.mjs build:dev
      # Package exports, platform resolution and staging, against the build above.
      - name: Native Node tests
        run: yarn workspace @octocodeai/octocode-native test:node
      - name: Tool health
        run: node skills-dev/octocode-dev/scripts/dev.mjs test:tools
