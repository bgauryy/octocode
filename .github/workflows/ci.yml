name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      OCTOCODE_NO_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Lint
        run: node skills-dev/octocode-dev/scripts/dev.mjs lint:ci
      - name: Test
        run: node skills-dev/octocode-dev/scripts/dev.mjs test:ci
