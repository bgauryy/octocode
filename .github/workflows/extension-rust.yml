name: Extension Rust

on:
  push:
    branches: [main]
    paths:
      - 'packages/octocode-extension-rust/**'
      - '.github/workflows/extension-rust.yml'
  pull_request:
    paths:
      - 'packages/octocode-extension-rust/**'
      - '.github/workflows/extension-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Runtime / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - runner: windows-2022
            target: win32-x64-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: packages/octocode-extension-rust
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/octocode-extension-rust -> target
      - name: Format, lint and Rust runtime tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build, N-API and installed tarball runtime tests
        run: |
          node scripts/build.mjs --release --target ${{ matrix.target }}
          node --test "tests/*.test.mjs"
          node scripts/check-platforms.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension-rust-${{ matrix.target }}
          path: packages/octocode-extension-rust/npm/${{ matrix.target }}/*.node
          if-no-files-found: error

  musl:
    name: Runtime / linux-x64-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and execute on Alpine musl
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/packages/octocode-extension-rust rust:alpine sh -ec '
            apk add --no-cache nodejs npm build-base
            rustup component add rustfmt clippy
            export RUSTFLAGS="-C target-feature=-crt-static"
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo test --locked
            node scripts/build.mjs --release --target linux-x64-musl
            node --test "tests/*.test.mjs"
            node scripts/check-platforms.mjs --target linux-x64-musl
          '
      - uses: actions/upload-artifact@v4
        with:
          name: extension-rust-linux-x64-musl
          path: packages/octocode-extension-rust/npm/linux-x64-musl/*.node
          if-no-files-found: error

  packages:
    name: Validate all six release packages
    needs: [native, musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: extension-rust-*
          path: native-artifacts
          merge-multiple: true
      - name: Assemble and validate package contents
        working-directory: packages/octocode-extension-rust
        run: |
          node --input-type=module -e "import { copyFileSync } from 'node:fs'; import { platforms } from './platforms.cjs'; for (const p of platforms) copyFileSync('../../native-artifacts/' + p.binary, 'npm/' + p.id + '/' + p.binary);"
          node scripts/check-platforms.mjs
