<html lang="en">
<head>
  <meta charset="UTF-8">

  <!--
    LLM: Set this to the slide heading / title. Used as tab title when opening
    the slide file directly (standalone mode).
  -->

  <!-- Always include both CSS files. Paths are relative to slides/ subfolder. -->

  <link rel="stylesheet" href="../css/theme.css">

  <!--
    ═══════════════════════════════════════════════════════════════════
    LLM: ADD CDN LIBRARIES HERE — only if this specific slide needs them.

    highlight.js (code syntax coloring):
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css">
      <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
      Then add at bottom of body: <script>hljs.highlightAll();</script>

      Theme options (match to slide theme — see resources.md):
        github-dark       → Terminal theme
        monokai-sublime   → Blueprint theme
        github            → Editorial theme (light)
        ascetic           → Studio theme
        tokyo-night-dark  → Midnight theme

    marked.js (render Markdown content):
      <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
      Then add data-md attribute to the container div.
      And add at bottom of body: see markdown pattern below.

    Chart.js (bar, line, donut, scatter, radar):
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      Use <canvas> element in body.

    ECharts (heatmap, geo, treemap, candlestick, complex charts):
      <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
      Use <div id="chart" class="chart-surface"></div> in body.

    uPlot (dense time-series):
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.min.css">
      <script src="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.iife.min.js"></script>
      Use <div id="chart" class="chart-surface"></div> in body.

    ApexCharts (polished multi-type charts):
      <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
      Use <div id="chart" class="chart-surface"></div> in body.

    Mermaid.js (flowcharts, sequence diagrams):
      <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
      Use <div class="mermaid"> in body + mermaid.initialize() at bottom.

    D3.js (custom SVG, networks, bespoke charts — ESM):
      Do NOT add in <head>. Import from a <script type="module"> at bottom:
      import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    Motion (stagger, counters, timeline — loaded as ESM module):
      Do NOT add in <head>. Add <script type="module"> at bottom of <body>.
      See Motion patterns in references/html-templates.md.
    ═══════════════════════════════════════════════════════════════════
  -->

  <!--

<!--
  ═══════════════════════════════════════════════════════════════════════════
  SLIDE CONTAINER
  LLM: Change slide--TYPE to the appropriate type for this slide.

  Layout classes applied automatically by base.css for each type:
    slide--title       → centered, large display text, no header/body zones
    slide--agenda      → header zone + numbered list body
    slide--section     → centered, section number + display heading
    slide--content     → header zone + bulleted list body (max 4 bullets)
    slide--two-col     → header zone + 2-column grid body
    slide--quote       → centered, large quote mark + blockquote
    slide--code        → header zone + code block + caption
    slide--chart       → header zone + chart area + insight line
    slide--timeline    → header zone + vertical timeline list
    slide--comparison  → header zone + 3-column grid (col | divider | col)
    slide--stats       → header zone + stat grid (1–3 large KPI numbers)
    slide--image       → full-bleed image/video + gradient overlay + optional caption
    slide--closing     → centered, display text + CTA + links

  For full HTML markup per type, see: references/html-templates.md
  ═══════════════════════════════════════════════════════════════════════════
-->
<div class="slide slide--<!-- LLM: TYPE (e.g., content) -->">

  <!--
    ═══════════════════════════════════════════════════════════════════
    SLIDE HEADER — slide heading / title
    LLM: Include <div class="slide-header"> only for slides that have a
    heading zone (content, two-col, code, chart, timeline, comparison).
    Title, section, quote, and closing slides do NOT use slide-header.
    ═══════════════════════════════════════════════════════════════════
  -->
  <div class="slide-header">
    <!--
      Heading classes:
        .display  → large accent-colored display text (title/section slides)
        .title    → standard slide heading (content, code, chart, etc.)
        .subtitle → supporting line under display or title
        .eyebrow  → small uppercase label above the heading
    -->
    <h2 class="title fade-in"><!-- LLM: Slide heading text --></h2>
  </div>

  <!--
    ═══════════════════════════════════════════════════════════════════
    SLIDE BODY — main content area
    LLM: Replace the comment below with the correct markup for the
    slide type. See references/html-templates.md for full templates.

    Common patterns:
      Bullets:
        <ul class="bullets">
          <li class="slide-up delay-1">{{Point}}</li>
          ...max 4 items
        </ul>

      Two columns:
        <div class="two-col">
          <div class="col slide-up delay-1">
            <h3 class="col-heading">{{Left}}</h3>
            <ul><li>{{Point}}</li></ul>
          </div>
          <div class="col slide-up delay-2">...</div>
        </div>

      Code block (plain CSS, no highlight.js):
        <pre class="code-block slide-up delay-1">
          <code class="language-{{js|python|bash|go|rust}}">{{code}}</code>
        </pre>

      Quote:
        <p class="quote-mark fade-in" aria-hidden="true">"</p>
        <blockquote class="quote-text slide-up">{{quote}}</blockquote>
        <cite class="quote-attr fade-in delay-2">— {{Name}}</cite>

      Chart (HTML+CSS bars — no JS library):
        <div class="bar-chart slide-up delay-1" role="img" aria-label="{{description}}">
          <div class="bar-row">
            <span class="bar-label">{{Label}}</span>
            <div class="bar" style="--pct:75%"><span>{{Value}}</span></div>
          </div>
        </div>
        <p class="chart-insight fade-in delay-3">{{Insight}}</p>

      Markdown content (requires marked.js in <head>):
        <div class="md-body slide-up delay-1" data-md>
          {{raw markdown text}}
        </div>

    ═══════════════════════════════════════════════════════════════════
  -->

  <!-- LLM: Replace this comment with the correct content markup for this slide type -->

</div><!-- end .slide -->
