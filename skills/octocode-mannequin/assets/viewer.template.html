<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>octocode-mannequin viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e8e8ea; font: 13px/1.4 -apple-system, sans-serif; overflow: hidden; }
  #scene { position: absolute; inset: 0; }
  #panel { position: absolute; top: 0; right: 0; width: 300px; height: 100%; overflow-y: auto; background: rgba(20,22,26,0.92); padding: 10px 14px; box-sizing: border-box; }
  #panel h2 { font-size: 13px; margin: 14px 0 6px; color: #8fd3ff; border-bottom: 1px solid #333; padding-bottom: 3px; }
  #panel h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { flex: 0 0 108px; font-size: 11px; color: #bbb; }
  .row input[type=range] { flex: 1; }
  .row output { flex: 0 0 34px; text-align: right; font-size: 11px; color: #8fd3ff; }
  #hint { position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: #888; }
  #mcp { position: absolute; left: 10px; top: 10px; font-size: 11px; padding: 4px 9px; border-radius: 5px; font-weight: 600; }
  #mcp.on { background: rgba(90,200,120,0.18); color: #7fe0a0; border: 1px solid #2f6d47; }
  #mcp.off { background: rgba(200,90,90,0.15); color: #e08f8f; border: 1px solid #6d3030; }
  button.reset { width: 100%; margin: 8px 0 2px; padding: 5px; background: #2a2d33; color: #ddd; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  button.reset:hover { background: #383c44; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="mcp"></div>
<div id="panel"><div id="controls"></div><button class="reset" id="resetBtn">Reset to rest pose</button></div>
<div id="hint">Agent control surface (WebMCP). Humans: drag rotate · scroll zoom · sliders → pose. Agents: call get_scheme for the frame/units/convention contract, then apply_pose / reach / play_sequence.</div>
<!-- Machine-readable agent contract (populated at load from AGENT_GUIDE); also returned by the get_scheme tool. -->
<script type="application/json" id="mcp-agent-guide">{}</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@latest/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Generated by scripts/skeleton.mjs viewer — data below is the single source of truth (BONES/JOINTS in
// skeleton.mjs); this page ports the same swing-twist/hinge/box clamp algorithm to THREE.Quaternion so the
// slider UI can never exceed references/rom-table.md's limits.
const SCHEME = "__SCHEME_JSON__";
const POSE_COMMAND = "__POSE_JSON__";

const DIR = {
  up: new THREE.Vector3(0, 1, 0), down: new THREE.Vector3(0, -1, 0),
  left: new THREE.Vector3(-1, 0, 0), right: new THREE.Vector3(1, 0, 0),
  forward: new THREE.Vector3(0, 0, 1),
};
const jointKeyFor = (name) => name.replace(/_[LR]$/, '');

// ---------- scene ----------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 50);
camera.position.set(2.0, 1.4, 2.4);
// Rendering is best-effort: if WebGL is unavailable (e.g. a headless Chrome without a GPU/SwiftShader), the
// scene won't draw, but the bone model, forward kinematics, and WebMCP tools must still work so an agent can
// pose the figure headlessly. Never let renderer creation abort the module.
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('scene').appendChild(renderer.domElement);
} catch (err) {
  console.warn('WebGL unavailable — running headless (pose/FK/WebMCP still active):', err.message);
}
const controls = new OrbitControls(camera, renderer ? renderer.domElement : document.getElementById('scene'));
controls.target.set(0, 0.9, 0); // mid-body of the grounded (standing) figure
scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.2));
const grid = new THREE.GridHelper(2, 20, 0x444455, 0x2a2a33);
scene.add(grid);
// Paint one frame NOW. Called after every pose change and every animation tick so motion shows even when
// requestAnimationFrame is throttled/paused (unfocused window, headless/CDP-driven, background tab) — the cause
// of the figure looking "stuck": rAF stops firing, so an rAF-only loop freezes. A direct render never freezes.
function renderOnce() { if (renderer) { controls.update(); renderer.render(scene, camera); } }

// ---------- bone hierarchy (real THREE.Bone, per the research's leanest-viable-stack recommendation) ----------

const boneMap = new Map();
for (const b of SCHEME.bones) boneMap.set(b.name, new THREE.Bone());
const root = boneMap.get('Hips');
for (const b of SCHEME.bones) {
  const bone = boneMap.get(b.name);
  bone.name = b.name;
  const wq = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), DIR[b.dir]);
  const parentBone = b.parent ? boneMap.get(b.parent) : null;
  const parentWq = parentBone ? parentBone.userData.restWorldQuat : new THREE.Quaternion();
  const parentStart = parentBone ? parentBone.userData.restWorldStart : new THREE.Vector3();
  const parentEnd = parentBone ? parentBone.userData.restWorldEnd : new THREE.Vector3();
  const start = parentEnd.clone().add(new THREE.Vector3(...b.startOffset));
  const end = start.clone().add(DIR[b.dir].clone().multiplyScalar(b.length));
  const restQuat = parentWq.clone().invert().multiply(wq);
  const restPos = start.clone().sub(parentStart).applyQuaternion(parentWq.clone().invert());
  bone.position.copy(restPos);
  bone.quaternion.copy(restQuat);
  bone.userData = { restQuat, restWorldQuat: wq, restWorldStart: start, restWorldEnd: end, length: b.length };
  if (parentBone) parentBone.add(bone); else scene.add(bone);
}

// visual capsule per bone (skipped for 0-length spacer-free — all bones have length here) + sphere per joint
const boneMat = new THREE.MeshStandardMaterial({ color: 0x8fd3ff, roughness: 0.5 });
const jointMat = new THREE.MeshStandardMaterial({ color: 0xffb15c, roughness: 0.5 });
for (const b of SCHEME.bones) {
  const bone = boneMap.get(b.name);
  const r = Math.max(0.012, b.length * 0.09);
  const capsule = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(0.001, b.length - r * 2), 4, 8), boneMat);
  capsule.position.set(0, b.length / 2, 0);
  bone.add(capsule);
  const joint = new THREE.Mesh(new THREE.SphereGeometry(r * 1.3, 12, 8), jointMat);
  bone.add(joint);
}

// ---------- movement protocol, ported from scripts/skeleton.mjs ----------

const MOVEMENTS = {
  flexion: ['x', 1], extension: ['x', -1], abduction: ['z', 1], adduction: ['z', -1],
  dorsiflexion: ['x', 1], plantarflexion: ['x', -1], inversion: ['z', 1], eversion: ['z', -1],
  elevation: ['x', 1], depression: ['x', -1], protraction: ['z', 1], retraction: ['z', -1],
  lateralFlexion: ['z', 1], lateralExcursion: ['z', 1],
  internalRotation: ['y', 1], externalRotation: ['y', -1], pronation: ['y', 1], supination: ['y', -1],
  radialDeviation: ['z', 1], ulnarDeviation: ['z', -1], rotation: ['y', 1],
};
const AXIS_VEC = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
const deg = THREE.MathUtils.degToRad;

// sideSign mirrors the LEFT side (_L bones): lateral (z) and axial (y) rotations negate so abduction goes left
// on the left limb; sagittal flexion (x) and the ROM buckets are untouched. Must match scripts/skeleton.mjs.
function clampBox(axes, perAxis, flip = {}, warnings, joint, sideSign = 1) {
  const mirror = { x: 1, y: sideSign, z: sideSign };
  const q = new THREE.Quaternion();
  for (const axis of ['x', 'z', 'y']) {
    const limit = axes[axis];
    if (!limit) continue;
    const v = THREE.MathUtils.clamp(perAxis[axis], limit.min, limit.max);
    if (warnings && v !== perAxis[axis]) warnings.push(`${joint}.${axis} clamped ${perAxis[axis]}->${v}`);
    q.multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_VEC[axis], deg(v * (flip[axis] || 1) * mirror[axis])));
  }
  return q;
}

function clampSwingTwist(spec, perAxis, warnings, joint, sideSign = 1) {
  const { swing, twist } = spec;
  let flex = perAxis.x, abd = perAxis.z;
  const ux = flex / (flex >= 0 ? swing.flex : swing.ext);
  const uz = abd / (abd >= 0 ? swing.abd : swing.add);
  const mag = Math.hypot(ux, uz);
  if (mag > 1) { flex /= mag; abd /= mag; if (warnings) warnings.push(`${joint} swing scaled by ${(1 / mag).toFixed(3)} to stay inside cone`); }
  const tw = twist ? THREE.MathUtils.clamp(perAxis.y, twist.min, twist.max) : 0;
  if (warnings && twist && tw !== perAxis.y) warnings.push(`${joint}.twist clamped ${perAxis.y}->${tw}`);
  const angle = Math.hypot(flex, abd);
  const swingQuat = angle < 1e-9 ? new THREE.Quaternion() : new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(flex, 0, abd * sideSign).normalize(), deg(angle));
  const twistQuat = new THREE.Quaternion().setFromAxisAngle(AXIS_VEC.y, deg(tw * sideSign));
  return swingQuat.multiply(twistQuat);
}

const jointState = {}; // joint name -> {x,y,z} degrees, the live slider values
function applyJoint(boneName, warnings) {
  const bone = boneMap.get(boneName);
  const spec = SCHEME.joints[jointKeyFor(boneName)];
  const perAxis = jointState[boneName] || { x: 0, y: 0, z: 0 };
  const sideSign = boneName.endsWith('_L') ? -1 : 1;
  let delta;
  if (spec.constraint === 'swing-twist') delta = clampSwingTwist(spec, perAxis, warnings, boneName, sideSign);
  else if (spec.constraint === 'hinge-twist') {
    const hinge = clampBox(spec.axes, { x: perAxis.x, z: 0, y: 0 }, spec.flip, warnings, boneName, sideSign);
    const tw = THREE.MathUtils.clamp(perAxis.y, spec.twist.min, spec.twist.max);
    if (warnings && tw !== perAxis.y) warnings.push(`${boneName}.twist clamped ${perAxis.y}->${tw}`);
    delta = hinge.multiply(new THREE.Quaternion().setFromAxisAngle(AXIS_VEC.y, deg(tw * sideSign)));
  } else delta = clampBox(spec.axes, perAxis, spec.flip, warnings, boneName, sideSign);
  bone.quaternion.copy(bone.userData.restQuat).multiply(delta);
}

/** window.applyPose({pose:[{joint,movements}], root?}) — same wire format as `skeleton.mjs pose`. */
window.applyPose = function applyPose(command) {
  for (const entry of command.pose || []) {
    const spec = SCHEME.joints[jointKeyFor(entry.joint)];
    const perAxis = { x: 0, y: 0, z: 0 };
    for (const [name, value] of Object.entries(entry.movements || {})) {
      const [defaultAxis, sign] = MOVEMENTS[name];
      const axis = spec.axisMap?.[name] || defaultAxis;
      perAxis[axis] += value * sign;
    }
    jointState[entry.joint] = perAxis;
    applyJoint(entry.joint);
    syncSlidersFor(entry.joint);
  }
  setRoot(command.root);
  commitGround();
};

function targetsFor(command) {
  const targets = {};
  for (const entry of command.pose || []) {
    const spec = SCHEME.joints[jointKeyFor(entry.joint)];
    const perAxis = { x: 0, y: 0, z: 0 };
    for (const [name, value] of Object.entries(entry.movements || {})) {
      const [defaultAxis, sign] = MOVEMENTS[name];
      perAxis[spec.axisMap?.[name] || defaultAxis] += value * sign;
    }
    targets[entry.joint] = perAxis;
  }
  return targets;
}

// Catmull-Rom on the resolved degree values (not on quaternion components — so no unit-sphere drift). Gives
// C1-continuous velocity through keyframes: ~46x lower jerk than linear and no seam pop on a loop (measured),
// which is what stops keyframed motion looking robotic. Interpolating angles then re-clamping keeps every frame
// inside range of motion. (Evidence: references/references.md — animation interpolation research.)
function catmull(a, b, c, d, t) { const t2 = t * t, t3 = t2 * t; return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3); }

// Kinematic gravity for the airborne arc: replace the authored root.ty on the contiguous fly:true keyframes with
// a real parabola ty = v0·t − ½·g·t² (symmetric hop, apex = v0²/2g). Author picks launch {apex} metres or {v0}
// m/s; g defaults to 9.8. Deterministic, no physics engine — feet still don't do ground reaction/balance.
function applyLaunch(frames, launch) {
  if (!launch) return frames;
  const g = launch.g ?? 9.8;
  const v0 = launch.apex != null ? Math.sqrt(2 * g * launch.apex) : launch.v0;
  if (!v0) return frames;
  const flyIdx = frames.map((f, i) => (f.root && f.root.fly ? i : -1)).filter((i) => i >= 0);
  if (!flyIdx.length) return frames;
  const T = 2 * v0 / g, n = flyIdx.length + 1; // fly frames split the hang time into n intervals
  const out = frames.map((f) => ({ ...f }));
  flyIdx.forEach((fi, k) => { const t = ((k + 1) / n) * T; out[fi].root = { ...out[fi].root, ty: v0 * t - 0.5 * g * t * t }; });
  return out;
}

/**
 * window.playSequence([poseCommand, ...], {frameMs, loop}) — smoothly tweens through the same pose-command
 * shape window.applyPose takes, via looped Catmull-Rom. Joints a frame omits hold their previous keyframe's
 * value (carry-forward); write only what moves each keyframe. loop:true cycles seamlessly until stopSequence.
 */
window.playSequence = async function playSequence(frames, opts = {}) {
  const frameMs = opts.frameMs ?? 400, loop = !!opts.loop;
  window.__stopSequence = false;
  if (!frames || !frames.length) return;
  frames = applyLaunch(frames, opts.launch); // gravity: overwrite airborne ty with a real parabola if requested
  const resolved = frames.map(targetsFor);
  const joints = [...new Set(resolved.flatMap((r) => Object.keys(r)))];
  const tracks = {}; // joint -> per-keyframe {x,y,z}, carrying forward the last set value
  for (const j of joints) { let last = { ...(jointState[j] || { x: 0, y: 0, z: 0 }) }; tracks[j] = resolved.map((r) => (last = r[j] ? r[j] : last, { ...last })); }
  // root track: interpolate the whole-figure transform across keyframes the same way (carry forward, then C-R)
  const ROOT_FIELDS = ['tx', 'ty', 'tz', 'pitch', 'yaw', 'roll'];
  let lastRoot = { tx: 0, ty: 0, tz: 0, pitch: 0, yaw: 0, roll: 0 };
  const rootTrack = frames.map((f) => (lastRoot = f.root ? { ...lastRoot, ...f.root } : lastRoot, { ...lastRoot, fly: !!(f.root && f.root.fly) }));
  const anyRoot = frames.some((f) => f.root);
  if (!anyRoot) setRoot(null); // a sequence with no root motion stands at origin (clear any leftover tumble)
  const N = frames.length;
  const idx = (k) => loop ? ((k % N) + N) % N : Math.max(0, Math.min(N - 1, k));
  const samp = (a, u, ax) => { const i = Math.floor(u), f = u - i; return catmull(a[idx(i - 1)][ax], a[idx(i)][ax], a[idx(i + 1)][ax], a[idx(i + 2)][ax], f); };
  // Root sampling differs from joints in two ways that fix the "weird flip end":
  //  (1) net delta ACCUMULATES across loop cycles — a looped flip keeps rotating forward (0→-360→-720…) instead
  //      of the scalar snapping -360→0 and spinning the body backward at the seam;
  //  (2) each interval is CLAMPED to its two bracketing keyframes so Catmull-Rom cannot overshoot — no rotating
  //      past the upright landing, no foot dipping below the floor.
  const netDelta = {}; for (const k of ROOT_FIELDS) netDelta[k] = rootTrack[N - 1][k] - rootTrack[0][k];
  const rootAt = (k, ax) => loop ? rootTrack[((k % N) + N) % N][ax] + Math.floor(k / N) * netDelta[ax] : rootTrack[Math.max(0, Math.min(N - 1, k))][ax];
  const sampRoot = (u, ax) => { const i = Math.floor(u), f = u - i; const b = rootAt(i, ax), c = rootAt(i + 1, ax);
    const v = catmull(rootAt(i - 1, ax), b, rootAt(i + 1, ax), rootAt(i + 2, ax), f);
    return Math.max(Math.min(b, c), Math.min(Math.max(b, c), v)); };
  const t0 = performance.now();
  // Driven by a real setInterval timer, NOT requestAnimationFrame: rAF is throttled/paused when the window is
  // unfocused or the tab is background/headless/CDP-driven, which froze the animation ("stuck"). A timer fires
  // regardless, and commitGround() paints each tick, so motion stays smooth even when nothing else is repainting.
  await new Promise((resolve) => {
    const timer = setInterval(() => {
      if (window.__stopSequence) { clearInterval(timer); return resolve(); }
      const e = (performance.now() - t0) / frameMs;
      const uJ = loop ? (e % N) : Math.min(e, N - 1); // joints + fly flag: cyclic (or clamped one-shot)
      const uR = loop ? e : Math.min(e, N - 1);        // root: monotonic so net delta accumulates across cycles
      for (const j of joints) { const a = tracks[j]; jointState[j] = { x: samp(a, uJ, 'x'), y: samp(a, uJ, 'y'), z: samp(a, uJ, 'z') }; applyJoint(j); syncSlidersFor(j); }
      if (anyRoot) { const r = {}; for (const k of ROOT_FIELDS) r[k] = sampRoot(uR, k); r.fly = rootTrack[idx(Math.floor(uJ))].fly; setRoot(r); }
      commitGround(); // advances + paints this frame
      if (!loop && e >= N - 1) { clearInterval(timer); return resolve(); }
    }, 16);
  });
};
window.stopSequence = () => { window.__stopSequence = true; };
window.mannequin = { scene, camera, controls, boneMap, jointState, THREE };

// ---------- grounding: shift the whole rig so the lowest foot rests on the floor (y=0) ----------
// The rig is rooted at the pelvis; at rest the feet hang below the origin. Offsetting the pelvis Y each frame so
// the lowest foot sits on the floor (a) makes the figure stand on the grid instead of floating, and (b) yields
// the pelvis vertical bob of a gait for free — high when a leg is straight (passing), low when knees bend
// (contact). This is the pure-FK specialization of the foot-IK "drop pelvis by lowest-foot offset" step; it does
// NOT reproduce a true airborne flight phase (that needs root translation/IK, deliberately out of scope).
let groundEnabled = true;
const GROUND_BONES = ['Foot_L', 'Foot_R', 'Toes_L', 'Toes_R'];
const hipsBone = boneMap.get('Hips');
const HIPS_REST_Q = hipsBone.quaternion.clone();
const REST_HIPS_Y = hipsBone.position.y;
// standing hips height (feet on floor) — the baseline that flight ty is measured from, so ty=0 in the air
// equals standing height and a positive ty launches upward. Measured once at the rest pose.
scene.updateMatrixWorld(true);
// Root 6-DOF: the whole-figure transform (translate + pitch/yaw/roll) applied to Hips, the FK root. Enables
// traveling/turning/jumping motion and backflips — per-joint FK can only fold the body around a fixed pelvis.
let currentRoot = { tx: 0, ty: 0, tz: 0, pitch: 0, yaw: 0, roll: 0, fly: false };
const isFlying = (r) => r.fly || r.pitch % 360 !== 0 || r.roll % 360 !== 0;
function lowestFootWorldY() {
  let m = Infinity;
  for (const n of GROUND_BONES) {
    const b = boneMap.get(n);
    const start = b.getWorldPosition(new THREE.Vector3());
    const tip = new THREE.Vector3(0, b.userData.length, 0).applyQuaternion(b.getWorldQuaternion(new THREE.Quaternion())).add(start);
    m = Math.min(m, start.y, tip.y);
  }
  return m;
}
const STAND_Y = REST_HIPS_Y - lowestFootWorldY(); // hips height at rest with feet exactly on the floor
// Place Hips from the root transform, then (unless flying) drop the rig so the lowest foot rests on the floor.
function commitGround() {
  const r = currentRoot;
  const rootQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(deg(r.pitch), deg(r.yaw), deg(r.roll), 'YXZ'));
  hipsBone.quaternion.copy(rootQ).multiply(HIPS_REST_Q);
  if (isFlying(r) || !groundEnabled) {
    hipsBone.position.set(r.tx, STAND_Y + r.ty, r.tz); // ty is height above standing; airborne, no floor snap
    scene.updateMatrixWorld(true);
  } else {
    hipsBone.position.set(r.tx, REST_HIPS_Y + r.ty, r.tz);
    scene.updateMatrixWorld(true);
    hipsBone.position.y -= lowestFootWorldY(); // drop so the lowest foot rests on the floor
    scene.updateMatrixWorld(true);
  }
  renderOnce(); // paint immediately so every pose change shows without waiting on requestAnimationFrame
}
window.setGround = (on) => { groundEnabled = !!on; commitGround(); };
function setRoot(root) { currentRoot = { tx: 0, ty: 0, tz: 0, pitch: 0, yaw: 0, roll: 0, fly: false, ...(root || {}) }; }
window.setRoot = (root) => { setRoot(root); commitGround(); };

// ---------- protocol helpers shared by the WebMCP tools and the console API ----------

const MV_SHORT = {
  flexion: 'flex', extension: 'ext', abduction: 'abd', adduction: 'add',
  internalRotation: 'int-rot', externalRotation: 'ext-rot', pronation: 'pron', supination: 'sup',
  dorsiflexion: 'dorsi', plantarflexion: 'plantar', inversion: 'inv', eversion: 'ever',
  elevation: 'elev', depression: 'depr', protraction: 'protr', retraction: 'retr',
  lateralFlexion: 'lat-flex', lateralExcursion: 'lat-exc', radialDeviation: 'radial', ulnarDeviation: 'ulnar', rotation: 'rot',
};

function axesForJoint(spec) {
  return spec.constraint === 'swing-twist'
    ? { x: { min: -spec.swing.ext, max: spec.swing.flex }, z: { min: -spec.swing.add, max: spec.swing.abd }, ...(spec.twist ? { y: spec.twist } : {}) }
    : { ...(spec.axes || {}), ...(spec.twist ? { y: spec.twist } : {}) };
}

// movement name -> {axis, maxDegrees} for the movements this joint's allowlist permits, with the reachable
// magnitude in that movement's direction — the machine-readable version of references/rom-table.md per joint.
function movementsForJoint(jointName) {
  const spec = SCHEME.joints[jointKeyFor(jointName)];
  const axes = axesForJoint(spec);
  const out = {};
  for (const name of spec.movements || []) {
    const [defAxis, sign] = MOVEMENTS[name];
    const axis = spec.axisMap?.[name] || defAxis;
    const lim = axes[axis];
    if (!lim) continue;
    out[name] = { axis, maxDegrees: sign > 0 ? lim.max : -lim.min };
  }
  return out;
}

// Slider label for a joint's axis, from the movement names actually mapped to it (e.g. "flex / ext",
// "elev / depr") instead of a generic per-axis guess.
function axisLabel(jointName, axis) {
  const spec = SCHEME.joints[jointKeyFor(jointName)];
  const names = (spec.movements || []).filter((m) => (spec.axisMap?.[m] || MOVEMENTS[m][0]) === axis);
  const pos = names.find((m) => MOVEMENTS[m][1] > 0), neg = names.find((m) => MOVEMENTS[m][1] < 0);
  if (pos && neg) return `${MV_SHORT[pos]} / ${MV_SHORT[neg]}`;
  if (names.length) return names.map((m) => MV_SHORT[m]).join(' / ');
  return axis === 'y' ? 'twist' : axis === 'x' ? 'flex/ext' : 'abd/add';
}

function validatePose(command) {
  const errors = [];
  for (const entry of command.pose || []) {
    const spec = SCHEME.joints[jointKeyFor(entry.joint)];
    if (!boneMap.has(entry.joint)) { errors.push(`unknown joint "${entry.joint}"`); continue; }
    if (!spec) { errors.push(`joint "${entry.joint}" has no movable DOF (root or spacer)`); continue; }
    for (const name of Object.keys(entry.movements || {})) {
      if (!MOVEMENTS[name]) errors.push(`unknown movement "${name}"`);
      else if (spec.movements && !spec.movements.includes(name))
        errors.push(`movement "${name}" not valid for ${entry.joint}; valid: ${spec.movements.join(', ')}`);
    }
  }
  return errors;
}

// Like window.applyPose but validates against the allowlist, optionally resets untouched joints (merge:false),
// and returns {clamped warnings}. This is what the apply_pose WebMCP tool calls.
function applyPoseChecked(command, { merge = true, relative = false } = {}) {
  const errors = validatePose(command);
  if (errors.length) return { ok: false, errors };
  if (!merge) { for (const k of Object.keys(jointState)) delete jointState[k]; for (const b of boneMap.values()) b.quaternion.copy(b.userData.restQuat); }
  const warnings = [];
  for (const entry of command.pose || []) {
    const spec = SCHEME.joints[jointKeyFor(entry.joint)];
    // relative:true jogs FROM the joint's current value (robotics "incremental jog") instead of setting absolute.
    const perAxis = relative ? { ...(jointState[entry.joint] || { x: 0, y: 0, z: 0 }) } : { x: 0, y: 0, z: 0 };
    for (const [name, value] of Object.entries(entry.movements || {})) {
      const [defAxis, sign] = MOVEMENTS[name];
      perAxis[spec.axisMap?.[name] || defAxis] += value * sign;
    }
    jointState[entry.joint] = perAxis;
    applyJoint(entry.joint, warnings);
    syncSlidersFor(entry.joint);
  }
  setRoot(command.root);
  commitGround();
  return { ok: true, warnings };
}

function getPoseSnapshot() {
  const joints = {};
  for (const [name, v] of Object.entries(jointState)) if (v.x || v.y || v.z) joints[name] = { x: +v.x.toFixed(1), y: +v.y.toFixed(1), z: +v.z.toFixed(1) };
  const markers = {};
  for (const name of ['Head', 'Hand_L', 'Hand_R', 'Foot_L', 'Foot_R']) {
    const p = boneMap.get(name).getWorldPosition(new THREE.Vector3());
    markers[name] = [+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3)];
  }
  return { joints, markers };
}

// Orbit the camera to a named view or explicit spherical coords, for framing agent screenshots.
const CAMERA_PRESETS = { front: [0, 0, 3], back: [Math.PI, 0, 3], side: [Math.PI / 2, 0, 3], '3q': [Math.PI / 4, 0.35, 3], top: [0, Math.PI / 2 - 0.05, 3] };
function setCameraView(arg) {
  let az, el, dist;
  if (typeof arg === 'string') [az, el, dist] = CAMERA_PRESETS[arg] || CAMERA_PRESETS['3q'];
  else { az = arg.azimuth ?? Math.PI / 4; el = arg.elevation ?? 0.35; dist = arg.distance ?? 3; }
  const t = controls.target;
  camera.position.set(t.x + dist * Math.cos(el) * Math.sin(az), t.y + dist * Math.sin(el) + 0.3, t.z + dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(t); controls.update();
  return { azimuth: az, elevation: el, distance: dist };
}
window.setCameraView = setCameraView;

// ---------- reach: task-space (Cartesian) inverse kinematics ----------
// Robotics exposes both joint-space (set angles) AND task-space ("put the end-effector at world point X"). This
// is the latter: a deterministic coordinate-descent IK over the chain's joint axes that reuses applyJoint, so
// every trial stays ROM-clamped and convention-correct. No dependency, no physics — just "reach that point".
const REACH_CHAINS = {
  Hand_R: ['UpperArm_R', 'Forearm_R'], Hand_L: ['UpperArm_L', 'Forearm_L'],
  Foot_R: ['UpperLeg_R', 'LowerLeg_R'], Foot_L: ['UpperLeg_L', 'LowerLeg_L'],
};
function effectorTip(name) {
  const b = boneMap.get(name);
  const s = b.getWorldPosition(new THREE.Vector3());
  return new THREE.Vector3(0, b.userData.length, 0).applyQuaternion(b.getWorldQuaternion(new THREE.Quaternion())).add(s);
}
function axesOfJoint(j) {
  const spec = SCHEME.joints[jointKeyFor(j)];
  if (spec.constraint === 'swing-twist') return ['x', 'z', 'y'];
  return Object.keys(spec.axes || {}).concat(spec.twist ? ['y'] : []);
}
function reach(effector, target, iterations = 80) {
  const chain = REACH_CHAINS[effector];
  if (!chain) return { ok: false, error: `no reach chain for "${effector}"; use one of ${Object.keys(REACH_CHAINS)}` };
  const T = new THREE.Vector3(target[0], target[1], target[2]);
  const dist = () => effectorTip(effector).distanceTo(T);
  scene.updateMatrixWorld(true);
  let step = 40, best = dist();
  for (let it = 0; it < iterations && step > 0.4 && best > 0.02; it++) {
    let improved = false;
    for (const j of chain) {
      jointState[j] = jointState[j] || { x: 0, y: 0, z: 0 };
      for (const ax of axesOfJoint(j)) {
        for (const s of [step, -step]) {
          const old = jointState[j][ax];
          jointState[j][ax] = old + s; applyJoint(j); scene.updateMatrixWorld(true);
          const d = dist();
          if (d < best - 1e-4) { best = d; improved = true; } else { jointState[j][ax] = old; applyJoint(j); scene.updateMatrixWorld(true); }
        }
      }
    }
    if (!improved) step *= 0.5;
  }
  for (const j of chain) syncSlidersFor(j);
  commitGround();
  const tip = effectorTip(effector);
  return { ok: true, reached: best <= 0.06, distance: +best.toFixed(3), effector, target, effectorPos: [+tip.x.toFixed(3), +tip.y.toFixed(3), +tip.z.toFixed(3)] };
}
window.reach = reach;

// look_at: aim primitive (rigging "aim constraint") — turn the head to face a world point. Coordinate-descent
// the head's axes to align its face (+Z) with the direction to the target; ROM-clamped via applyJoint.
function lookAt(joint, target) {
  if (joint !== 'Head') return { ok: false, error: 'look_at currently supports "Head"' };
  const T = new THREE.Vector3(target[0], target[1], target[2]);
  const headPos = () => boneMap.get('Head').getWorldPosition(new THREE.Vector3());
  const faceDir = () => new THREE.Vector3(0, 0, 1).applyQuaternion(boneMap.get('Head').getWorldQuaternion(new THREE.Quaternion()));
  const score = () => { scene.updateMatrixWorld(true); return faceDir().dot(T.clone().sub(headPos()).normalize()); }; // 1 = facing exactly
  jointState.Head = jointState.Head || { x: 0, y: 0, z: 0 };
  let step = 30, best = score();
  for (let it = 0; it < 60 && step > 0.5; it++) {
    let improved = false;
    for (const ax of ['x', 'z', 'y']) for (const s of [step, -step]) {
      const old = jointState.Head[ax]; jointState.Head[ax] = old + s; applyJoint('Head');
      const sc = score(); if (sc > best + 1e-4) { best = sc; improved = true; } else { jointState.Head[ax] = old; applyJoint('Head'); }
    }
    if (!improved) step *= 0.5;
  }
  syncSlidersFor('Head'); commitGround();
  return { ok: true, joint, target, alignment: +best.toFixed(3), facing: best > 0.98 };
}
window.lookAt = lookAt;

// ---------- WebMCP: expose the manikin as page-native agent tools (webmcp.dev / webmachinelearning/webmcp) ----------
// The page registers tools via document.modelContext.registerTool; an agent discovers/invokes them over the
// Chrome WebMCP CDP domain (see references/webmcp-agent.md). Falls back silently to sliders + window.* console
// API when the browser lacks WebMCP support, so the viewer still works without the --enableFeatures flag.

const asText = (obj) => ({ content: [{ type: 'text', text: JSON.stringify(obj) }] });

// Self-describing contract so any unfamiliar agent can drive the rig correctly on the first try — the world
// frame, units, and sign conventions it otherwise has to guess. Returned inside get_scheme and embedded in the
// page as <script id="mcp-agent-guide">. This is the "explanation for agents": the page is an agent control
// surface first, a human slider UI second.
const AGENT_GUIDE = {
  purpose: 'A humanoid manikin you (an AI agent) drive over WebMCP tools. Every joint and the whole-body root are exposed; poses/animations are range-of-motion-clamped and validated, so you can command any reachable movement freely.',
  frame: { handedness: 'right', up: '+Y', forward: '+Z', right: '+X', origin: 'floor under the pelvis (feet rest at y=0)' },
  units: { jointMovements: 'degrees', rootTranslation: 'metres', rootRotation: 'degrees' },
  conventions: {
    movements: 'Use anatomical names (flexion, abduction, ...) valid for each joint; each is positive in its natural direction. Values are SIGNED degrees — a negative value goes the opposite way on that axis (e.g. lateralFlexion:-20 leans/turns the other side, rotation:-30 turns the other way), which is how you sway or turn both directions. Angles clamp to range of motion and report clamp warnings.',
    sides: 'Left/right limbs mirror automatically — abduction moves either arm/leg outward. Sign anchor for centerline joints: +lateralFlexion leans toward the figure\'s LEFT (−X), negative leans right; flip the sign to sway the other way.',
    root: 'root{tx,ty,tz,pitch,yaw,roll,fly} moves the WHOLE figure: pitch=forward/back somersault, yaw=turn, roll=cartwheel; fly:true goes airborne. Per-joint movements only fold the body around a fixed pelvis.',
    verify: 'Read get_pose (joint values + head/hands/feet world positions) or set_camera then screenshot — do not assume; confirm the figure moved.',
  },
  workflow: ['get_scheme (learn joints + this contract)', 'describe_joint(joint) for exact movements+limits', 'apply_pose to set a pose (or reach to touch a point)', 'play_sequence for animation', 'get_pose to verify'],
  primitives: { pose: 'apply_pose (absolute or relative jog)', reach: 'task-space IK to a world point', look_at: 'aim the head', animate: 'play_sequence (smooth Catmull-Rom tween, loop:true to cycle)', wholeBody: 'root{tx,ty,tz,pitch,yaw,roll,fly} to travel/turn/jump/flip' },
  fluidity: 'To look ALIVE, not stiff: (1) play_sequence with 6+ keyframes, never 1 static pose; (2) OVERLAP/secondary motion — stagger limbs so they do NOT all hit their extreme on the same frame (offset arm/head/spine peaks by a keyframe); (3) weight shift + a vertical bob (bend both knees on the downbeat so grounding drops the pelvis, straighten on the up); (4) sway with signed lateralFlexion/rotation and counter-rotate chest vs hips; (5) MOVING HOLDS — even at rest keep a slow looping idle (small breathing spine flex + micro sway) so it is never frozen; (6) contrast poses (stretched vs bent, up vs down) and asymmetry read as life. loop:true keeps it going.',
  examples: {
    wave_right_arm: { pose: [{ joint: 'UpperArm_R', movements: { flexion: 90, abduction: 40 } }, { joint: 'Forearm_R', movements: { flexion: 40 } }] },
    step_forward_and_turn: { pose: [{ joint: 'UpperLeg_R', movements: { flexion: 30 } }], root: { tz: 0.4, yaw: 30 } },
    reach_target: { effector: 'Hand_R', target: [0.3, 1.2, 0.4] },
  },
};

function registerMannequinTools() {
  const mc = document.modelContext;
  if (!mc || typeof mc.registerTool !== 'function') return 0;
  const jointNames = SCHEME.bones.filter((b) => SCHEME.joints[jointKeyFor(b.name)]).map((b) => b.name);
  const rootSchema = {
    type: 'object',
    description: 'Whole-figure transform: move/turn/tumble the pelvis in the world. Needed for travel, turns, jumps, and flips — per-joint movements only fold the body around a fixed pelvis.',
    properties: {
      tx: { type: 'number', description: 'metres, right(+)/left(-)' }, ty: { type: 'number', description: 'metres up(+): lift off the floor' }, tz: { type: 'number', description: 'metres forward(+)/back(-)' },
      pitch: { type: 'number', description: 'degrees: forward/back somersault (a backflip is 0→-360 pitch through an airborne arc)' },
      yaw: { type: 'number', description: 'degrees: turn/spin about vertical (pirouette)' },
      roll: { type: 'number', description: 'degrees: sideways cartwheel tilt' },
      fly: { type: 'boolean', description: 'true = suspend ground contact (airborne); the ty arc controls height instead.' },
    },
  };
  const poseCommandSchema = {
    type: 'object',
    properties: {
      pose: {
        type: 'array',
        description: 'Per-joint movements. Each movement value is degrees; the joint clamps to its range of motion.',
        items: {
          type: 'object',
          properties: { joint: { type: 'string', enum: jointNames }, movements: { type: 'object', additionalProperties: { type: 'number' } } },
          required: ['joint', 'movements'],
        },
      },
      root: rootSchema,
    },
    required: ['pose'],
  };
  const tools = [
    { name: 'get_scheme', readOnly: true, description: 'Call FIRST. Returns the agent contract (world frame, units, sign conventions, workflow, examples), the bone hierarchy, and every joint with its constraint + valid movements. Everything you need to drive the rig correctly.',
      inputSchema: { type: 'object', properties: {} },
      execute: () => asText({ guide: AGENT_GUIDE, bones: SCHEME.bones, joints: Object.fromEntries(Object.keys(SCHEME.joints).map((k) => [k, { constraint: SCHEME.joints[k].constraint, movements: SCHEME.joints[k].movements }])) }) },
    { name: 'describe_joint', readOnly: true, description: 'Return one joint\'s constraint type and the exact movements it supports with each movement\'s maximum degrees.',
      inputSchema: { type: 'object', properties: { joint: { type: 'string', enum: jointNames } }, required: ['joint'] },
      execute: ({ joint }) => { const spec = SCHEME.joints[jointKeyFor(joint)]; return spec ? asText({ joint, constraint: spec.constraint, movements: movementsForJoint(joint) }) : asText({ error: `unknown or non-movable joint "${joint}"` }); } },
    { name: 'get_pose', readOnly: true, description: 'Return the current pose: nonzero per-joint movement values and the world positions of head, hands, and feet.',
      inputSchema: { type: 'object', properties: {} },
      execute: () => asText(getPoseSnapshot()) },
    { name: 'apply_pose', readOnly: false, description: 'Set joint angles (degrees). Optional root moves/turns/tumbles the whole figure. merge:true (default) keeps other joints; merge:false resets them first. relative:true JOGS from current values (incremental) instead of absolute. Returns range-of-motion clamp warnings — read them to close the loop.',
      inputSchema: { type: 'object', properties: { pose: poseCommandSchema.properties.pose, root: rootSchema, merge: { type: 'boolean', description: 'Keep other joints (default true) or reset them first (false).' }, relative: { type: 'boolean', description: 'Add to current joint values (jog) instead of setting absolute.' } }, required: ['pose'] },
      execute: (input) => { const r = applyPoseChecked({ pose: input.pose, root: input.root }, { merge: input.merge !== false, relative: !!input.relative }); return asText(r.ok ? { applied: true, warnings: r.warnings } : { applied: false, errors: r.errors }); } },
    { name: 'reach', readOnly: false, description: 'Task-space IK: move a limb so its end-effector reaches a world point [x,y,z] (metres, +X right +Y up +Z forward). Solves the joint angles for you — no need to compute shoulder/elbow yourself. Returns reached:true/false + residual distance (structured reachability feedback); if unreached the target is out of range.',
      inputSchema: { type: 'object', properties: { effector: { type: 'string', enum: Object.keys(REACH_CHAINS) }, target: { type: 'array', items: { type: 'number' }, minItems: 3, maxItems: 3 } }, required: ['effector', 'target'] },
      execute: (input) => asText(reach(input.effector, input.target)) },
    { name: 'look_at', readOnly: false, description: 'Aim the head to face a world point [x,y,z] (gaze). Returns alignment (1.0 = facing exactly).',
      inputSchema: { type: 'object', properties: { joint: { type: 'string', enum: ['Head'] }, target: { type: 'array', items: { type: 'number' }, minItems: 3, maxItems: 3 } }, required: ['joint', 'target'] },
      execute: (input) => asText(lookAt(input.joint, input.target)) },
    { name: 'play_sequence', readOnly: false, description: 'Animate through keyframes (each the shape of apply_pose, may carry root). Omitted joints hold. frameMs = ms per transition; loop repeats until stop_sequence. Optional launch gives airborne (fly) frames a real gravity parabola.',
      inputSchema: { type: 'object', properties: { frames: { type: 'array', items: poseCommandSchema }, frameMs: { type: 'number' }, loop: { type: 'boolean' }, launch: { type: 'object', description: 'Kinematic gravity for the airborne arc.', properties: { apex: { type: 'number', description: 'peak height in metres (sets launch velocity)' }, v0: { type: 'number', description: 'takeoff velocity m/s (alternative to apex)' }, g: { type: 'number', description: 'gravity m/s² (default 9.8)' } } } }, required: ['frames'] },
      execute: (input) => { for (const f of input.frames || []) { const e = validatePose(f); if (e.length) return asText({ started: false, errors: e }); } window.playSequence(input.frames, { frameMs: input.frameMs, loop: input.loop, launch: input.launch }); return asText({ started: true, frames: (input.frames || []).length, loop: !!input.loop }); } },
    { name: 'stop_sequence', readOnly: false, description: 'Stop a looping/running sequence, leaving the manikin at its current pose.',
      inputSchema: { type: 'object', properties: {} }, execute: () => { window.stopSequence(); return asText({ stopped: true }); } },
    { name: 'reset_pose', readOnly: false, description: 'Return every joint to the neutral arms-down rest pose.',
      inputSchema: { type: 'object', properties: {} }, execute: () => { window.stopSequence(); document.getElementById('resetBtn').click(); return asText({ reset: true }); } },
    { name: 'set_camera', readOnly: false, description: 'Orbit the view to frame a screenshot. Use a preset view or explicit spherical coords (radians).',
      inputSchema: { type: 'object', properties: { view: { type: 'string', enum: Object.keys(CAMERA_PRESETS) }, azimuth: { type: 'number' }, elevation: { type: 'number' }, distance: { type: 'number' } } },
      execute: (input) => asText({ camera: setCameraView(input.view ? input.view : input) }) },
    { name: 'set_ground', readOnly: false, description: 'Toggle ground contact: when on (default), the whole rig shifts so the lowest foot rests on the floor (y=0) — the figure stands and its pelvis bobs with a gait instead of floating.',
      inputSchema: { type: 'object', properties: { enabled: { type: 'boolean' } }, required: ['enabled'] },
      execute: ({ enabled }) => { window.setGround(enabled); return asText({ ground: !!enabled }); } },
  ];
  let n = 0;
  for (const t of tools) {
    try { mc.registerTool({ name: t.name, description: t.description, inputSchema: t.inputSchema, annotations: { readOnly: t.readOnly }, execute: t.execute }); n++; }
    catch (err) { console.warn('WebMCP registerTool failed for', t.name, err); }
  }
  return n;
}

document.getElementById('mcp-agent-guide').textContent = JSON.stringify(AGENT_GUIDE); // publish the contract in-page
const mcpCount = registerMannequinTools();
{
  const badge = document.getElementById('mcp');
  badge.textContent = mcpCount ? `WebMCP: ${mcpCount} tools live` : 'WebMCP: unavailable (sliders + window.* only)';
  badge.className = mcpCount ? 'on' : 'off';
}

// ---------- slider panel ----------

const REGIONS = [
  ['Torso & head', ['Spine', 'Head', 'Jaw']],
  ['Right arm', ['Shoulder_R', 'UpperArm_R', 'Forearm_R', 'Hand_R']],
  ['Left arm', ['Shoulder_L', 'UpperArm_L', 'Forearm_L', 'Hand_L']],
  ['Right leg', ['UpperLeg_R', 'LowerLeg_R', 'Foot_R', 'Toes_R']],
  ['Left leg', ['UpperLeg_L', 'LowerLeg_L', 'Foot_L', 'Toes_L']],
];
const sliderEls = {}; // "Joint.axis" -> input element
const panel = document.getElementById('controls');
for (const [title, joints] of REGIONS) {
  const h = document.createElement('h2'); h.textContent = title; panel.appendChild(h);
  for (const jointName of joints) {
    const spec = SCHEME.joints[jointKeyFor(jointName)];
    const axes = spec.constraint === 'swing-twist'
      ? { x: { min: -spec.swing.ext, max: spec.swing.flex }, z: { min: -spec.swing.add, max: spec.swing.abd }, y: spec.twist }
      : { ...(spec.axes || {}), y: spec.twist };
    for (const axis of ['x', 'z', 'y']) {
      const limit = axes[axis];
      if (!limit) continue;
      const row = document.createElement('div'); row.className = 'row';
      const label = document.createElement('label');
      label.textContent = `${jointName} ${axisLabel(jointName, axis)}`;
      const input = document.createElement('input');
      input.type = 'range'; input.min = limit.min; input.max = limit.max; input.step = 1; input.value = 0;
      const out = document.createElement('output'); out.textContent = '0°';
      input.addEventListener('input', () => {
        out.textContent = `${input.value}°`;
        jointState[jointName] = jointState[jointName] || { x: 0, y: 0, z: 0 };
        jointState[jointName][axis] = Number(input.value);
        applyJoint(jointName); commitGround();
      });
      row.append(label, input, out); panel.appendChild(row);
      sliderEls[`${jointName}.${axis}`] = input;
    }
  }
}
function syncSlidersFor(jointName) {
  const perAxis = jointState[jointName] || { x: 0, y: 0, z: 0 };
  for (const axis of ['x', 'y', 'z']) {
    const el = sliderEls[`${jointName}.${axis}`];
    if (el) { el.value = perAxis[axis]; el.nextSibling.textContent = `${Math.round(perAxis[axis])}°`; }
  }
}
document.getElementById('resetBtn').addEventListener('click', () => {
  window.stopSequence();
  for (const key of Object.keys(jointState)) delete jointState[key];
  for (const bone of boneMap.values()) bone.quaternion.copy(bone.userData.restQuat);
  for (const el of Object.values(sliderEls)) { el.value = 0; el.nextSibling.textContent = '0°'; }
  setRoot(null); commitGround();
});

// bake in the pose this file was generated with, then stand it on the floor
window.applyPose(POSE_COMMAND);
commitGround();

// ---------- render loop ----------

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
});
if (renderer) (function tick() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(tick); })();
</script>
</body>
</html>
