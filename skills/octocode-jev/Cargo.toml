[package]
name = "octocode-jev"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde_json = "1.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
httpdate = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
