<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Snake Game</h1>
        
        <section aria-labelledby="instructions-heading">
            <h2 id="instructions-heading">How to Play</h2>
            <p>Use arrow keys or WASD to move. Eat food to grow and gain points. Avoid walls and your own tail. Click buttons or touch controls to play.</p>
        </section>
        
        <section aria-labelledby="game-heading">
            <h2 id="game-heading">Game Board</h2>
            <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
        </section>
        
        <section aria-live="polite" aria-atomic="true">
            <h2>Game Status</h2>
            <p>Score: <span id="score">0</span></p>
            <p>Status: <span id="status">Ready to start</span></p>
        </section>
        
        <section aria-labelledby="controls-heading">
            <h2 id="controls-heading">Controls</h2>
            <div class="button-group">
                <button id="start" type="button">Start</button>
                <button id="pause" type="button" disabled>Pause</button>
                <button id="restart" type="button">Restart</button>
            </div>
            <div class="direction-buttons">
                <button type="button" data-direction="up" aria-label="Move up">↑</button>
                <button type="button" data-direction="left" aria-label="Move left">←</button>
                <button type="button" data-direction="down" aria-label="Move down">↓</button>
                <button type="button" data-direction="right" aria-label="Move right">→</button>
            </div>
        </section>
    </main>
    
    <script type="module" src="app.mjs"></script>
</body>
</html>
